
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#183653">
<title>KANTORA | Virtual Office Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#183653;
  --navy2:#102a43;
  --blue:#3569a8;
  --blue2:#4d83c5;
  --bg:#f3f5f8;
  --white:#fff;
  --text:#17283f;
  --muted:#778395;
  --border:#e1e6ed;
  --green:#23835e;
  --red:#d65353;
  --yellow:#d49a35;
  --shadow:0 4px 18px rgba(27,51,78,.055);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,sans-serif;color:var(--text);font-size:13px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
input,textarea,select{
  width:100%;padding:11px 12px;border:1px solid var(--border);
  border-radius:7px;background:#fff;outline:none;color:var(--text)
}
input:focus,textarea:focus,select:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px #3569a817
}
textarea{resize:vertical;line-height:1.6}
button:disabled{opacity:.5;cursor:not-allowed}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4{letter-spacing:-.035em}
.muted{color:var(--muted);line-height:1.7}
.ui-icon{display:inline-block;vertical-align:middle;flex-shrink:0}
.small{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
.btn{
  border:0;border-radius:7px;padding:11px 16px;
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;font-weight:700;font-size:11px;transition:.2s
}
.btn-primary{background:var(--navy);color:white}
.btn-primary:hover{background:#294e72;transform:translateY(-1px)}
.btn-secondary{background:#edf2f7;color:var(--navy);border:1px solid #dce5ef}
.btn-danger{background:#fff0f0;color:#c34a4a}
.btn-outline{border:1px solid #cbd6e1;color:var(--navy);background:white}
.btn-small{padding:8px 11px;font-size:10px}
.btn-block{width:100%}
.icon-btn{
  border:0;background:transparent;color:#738194;
  padding:8px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center
}
.icon-btn:hover{background:#edf2f7;color:var(--navy)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px;font-size:19px}
.brand-mark{
  height:37px;width:37px;border-radius:9px;background:var(--blue);
  color:white;display:grid;place-items:center;font-weight:800;font-size:20px
}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.7px;color:var(--blue)}
.page-header{
  display:flex;justify-content:space-between;align-items:center;
  gap:20px;margin-bottom:25px
}
.page-header h1{font-size:24px;margin:0 0 7px}
.page-header p{margin:0;color:var(--muted);font-size:12px}
.panel{
  background:white;border:1px solid var(--border);
  border-radius:10px;padding:22px;box-shadow:var(--shadow);min-width:0
}
.panel h3{font-size:15px;margin:0}
.panel-heading{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-bottom:20px
}
.panel-heading p{font-size:11px;color:var(--muted);margin:6px 0 0}
.panel-heading a{color:var(--blue);font-size:11px;font-weight:700}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:11px;font-weight:700;color:#405066}
.field input,.field textarea,.field select{font-size:12px}
.field-help{font-size:10px;color:var(--muted);margin-top:-3px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.stats-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;margin-bottom:20px
}
.stat-card{
  background:white;border:1px solid var(--border);border-radius:9px;
  padding:17px;box-shadow:var(--shadow)
}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-top span{font-size:10px;color:var(--muted);font-weight:600}
.stat-icon{
  width:34px;height:34px;border-radius:9px;background:#eaf1fa;
  display:grid;place-items:center;color:var(--blue);font-size:17px
}
.stat-card strong{display:block;font-size:25px;margin:12px 0 5px}
.stat-card small{font-size:10px;color:var(--muted)}
.content-grid{
  display:grid;grid-template-columns:1.5fr 1fr;
  gap:18px;margin-bottom:20px
}
.welcome-banner{
  background:linear-gradient(115deg,#183653,#315c84);
  color:white;padding:28px;border-radius:11px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;min-height:155px
}
.welcome-banner h2{font-size:24px;margin:9px 0}
.welcome-banner p{color:#d3dfeb;line-height:1.7;max-width:520px;margin:0}
.welcome-banner .eyebrow{color:#b4cee7}
.welcome-symbol{font-size:56px;opacity:.6;padding:15px}
.task-list{display:flex;flex-direction:column}
.task-row{
  display:flex;align-items:center;gap:13px;
  padding:14px 0;border-bottom:1px solid #edf0f4
}
.task-row:last-child{border-bottom:0}
.task-icon{
  height:39px;width:39px;flex-shrink:0;border-radius:8px;
  background:#eaf1fa;color:var(--blue);display:grid;place-items:center;font-size:18px
}
.task-info{flex:1;min-width:0}
.task-info strong{display:block;font-size:12px;margin-bottom:6px}
.task-info small{font-size:10px;color:var(--muted)}
.badge{
  display:inline-flex;align-items:center;padding:5px 9px;
  border-radius:20px;font-size:9px;font-weight:700;white-space:nowrap
}
.badge-draft{background:#f0f1f3;color:#697586}
.badge-published{background:#e3f4ea;color:#278357}
.badge-completed{background:#e8f0fb;color:#3569a8}
.badge-submitted{background:#e6f1f7;color:#31738c}
.badge-graded{background:#e1f4eb;color:#23835e}
.badge-archived{background:#f0f1f3;color:#697586}
.empty-state{text-align:center;padding:42px 15px}
.empty-icon{
  width:54px;height:54px;margin:0 auto 15px;border-radius:14px;
  background:#edf2f8;color:var(--blue);display:grid;place-items:center;font-size:23px
}
.empty-state h3{font-size:14px;margin-bottom:8px}
.empty-state p{font-size:11px;color:var(--muted);line-height:1.7;max-width:340px;margin:0 auto 17px}
.summary-list{margin:15px 0 20px}
.summary-list div{
  display:flex;justify-content:space-between;padding:13px 0;
  border-bottom:1px solid #edf0f4;font-size:11px
}
.summary-list span{color:var(--muted)}
.summary-list strong{font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{
  background:#f7f8fa;text-align:left;padding:13px 12px;
  color:#68768a;font-size:10px;font-weight:700
}
td{padding:13px 12px;border-bottom:1px solid #edf0f4;font-size:11px}
td strong{font-size:11px}
.table-actions{display:flex;gap:5px}
.table-actions button,.table-actions a{
  border:0;background:#edf2f7;color:var(--navy);
  padding:7px;border-radius:5px;display:inline-flex
}
.table-actions button:hover,.table-actions a:hover{background:#dce7f3}
.count-label{font-size:10px;color:var(--muted);font-weight:600}
.class-list{display:flex;flex-direction:column;gap:10px}
.class-card{
  display:flex;align-items:center;gap:12px;padding:14px;
  border:1px solid var(--border);border-radius:8px
}
.class-card-icon{
  width:40px;height:40px;border-radius:8px;background:#eaf1fa;
  color:var(--blue);display:grid;place-items:center;font-size:20px
}
.class-card-info{flex:1;min-width:0}
.class-card-info strong{display:block;font-size:12px;margin-bottom:5px}
.class-card-info small{font-size:10px;color:var(--muted)}
.class-actions{display:flex;gap:5px}
.class-actions button{
  border:0;background:#f0f3f7;padding:8px;border-radius:5px;color:var(--navy)
}
.code-result{
  background:#eaf3fc;border:1px solid #c9ddf1;border-radius:8px;
  padding:15px;margin-top:18px;text-align:center
}
.code-result span{display:block;font-size:9px;color:var(--blue);font-weight:800}
.code-result strong{display:block;font-size:25px;letter-spacing:4px;margin:9px}
.code-result small{color:var(--muted);font-size:10px}
.type-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px
}
.type-card{
  border:1px solid var(--border);border-radius:8px;padding:15px;
  background:white;text-align:left;color:var(--text)
}
.type-card.active{border:1.5px solid var(--blue);background:#f0f6fd}
.type-card .type-symbol{font-size:22px;color:var(--blue);display:block;margin-bottom:10px}
.type-card strong{font-size:11px;display:block;margin-bottom:5px}
.type-card small{font-size:9px;color:var(--muted);line-height:1.5}
.question-editor{
  border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:12px
}
.question-editor h4{font-size:12px;margin-bottom:12px}
.question-editor .form-grid{gap:0 10px}
.question-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rubric-line{font-size:10px;color:var(--muted);margin:6px 0}
.assignment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.assignment-card{
  border:1px solid var(--border);border-radius:9px;padding:18px;
  display:flex;flex-direction:column;gap:12px
}
.assignment-card-top{display:flex;justify-content:space-between;align-items:center}
.assignment-card h3{font-size:14px;margin:0}
.assignment-card p{font-size:11px;color:var(--muted);line-height:1.7;margin:0;flex:1}
.assignment-card .eyebrow{font-size:9px;margin:0}
.assignment-deadline{font-size:10px;color:var(--muted);display:flex;gap:7px;align-items:center}
.join-form{display:flex;gap:10px;max-width:520px}
.join-form input{flex:1}
.student-alert{
  display:flex;justify-content:space-between;align-items:center;gap:22px;
  padding:24px 26px;background:#fff;border:1px solid #dce5ef;
  border-left:4px solid var(--blue);border-radius:10px;margin-bottom:20px;
  box-shadow:var(--shadow)
}
.student-alert-copy{min-width:0;flex:1}
.student-alert-kicker{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.4px;margin-bottom:10px}
.student-alert h2{font-size:20px;margin:0 0 8px;color:var(--navy)}
.student-alert p{font-size:12px;line-height:1.7;color:#5e6d80;margin:0 0 10px}
.student-alert-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.student-alert-action{flex-shrink:0}
.material-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start}
.material-class-list{display:flex;flex-direction:column;gap:7px}
.material-class-button{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  border:1px solid transparent;background:transparent;border-radius:8px;
  padding:11px;color:var(--text)
}
.material-class-button:hover,.material-class-button.active{background:#edf3fa;border-color:#d7e3f0;color:var(--navy)}
.material-class-button .class-label{flex:1;min-width:0;font-size:11px;font-weight:700}
.material-class-button small{font-size:9px;color:var(--muted)}
.class-section{margin-bottom:16px}
.rubric-auto-note{background:#eef5fc;border:1px solid #d8e6f4;color:#45617e;border-radius:7px;padding:10px 12px;font-size:10px;line-height:1.6;margin:12px 0}
@media(max-width:760px){
  .student-alert{align-items:flex-start;flex-direction:column;padding:20px}
  .student-alert-action{width:100%}
  .student-alert-action .btn{width:100%}
  .material-layout{grid-template-columns:1fr}
  .material-class-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
.document-row{
  display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid #edf0f4
}
.document-row>div{flex:1}
.document-row strong{display:block;font-size:11px}
.document-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.document-row button{
  border:0;background:#edf2f7;padding:8px;border-radius:5px;
  display:flex;align-items:center;gap:5px;color:var(--navy);font-size:10px
}
.task-detail-hero{
  padding:25px;background:linear-gradient(115deg,#183653,#315c84);
  color:white;border-radius:10px;margin-bottom:18px
}
.task-detail-hero h2{font-size:23px;margin:10px 0}
.task-detail-hero p{color:#d7e2ec;line-height:1.7;max-width:700px}
.task-detail-hero .eyebrow{color:#c0d8ef}
.task-meta{display:flex;gap:20px;flex-wrap:wrap;color:#e1e9f0;font-size:10px}
.task-meta span{display:flex;align-items:center;gap:6px}
.instruction-text{white-space:pre-wrap;font-size:12px;line-height:1.85;color:#536174;margin:18px 0}
.document-list{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}
.document-list h4{font-size:12px}
.success-panel{
  text-align:center;background:#f0f8f3;border:1px solid #d6ebdf;
  border-radius:9px;padding:30px 15px
}
.success-panel .success-icon{font-size:32px;color:var(--green)}
.success-panel h3{font-size:15px;margin:12px 0}
.success-panel p{font-size:11px;color:var(--muted);line-height:1.7}
.quiz-question{
  border:1px solid var(--border);border-radius:8px;
  padding:17px;margin-bottom:15px
}
.quiz-question>strong{display:block;font-size:12px;line-height:1.7;margin-bottom:12px}
.quiz-question>small{font-size:10px;color:var(--muted)}
.radio-option{
  display:flex;gap:10px;align-items:center;padding:10px;
  background:#f8f9fb;border-radius:6px;margin-top:7px;font-size:11px
}
.radio-option input{width:auto}
.review-layout{display:grid;grid-template-columns: .9fr 1.5fr;gap:18px}
.submission-item{
  width:100%;border:0;background:white;display:flex;align-items:center;
  gap:10px;padding:12px 8px;text-align:left;border-bottom:1px solid #edf0f4
}
.submission-item:hover,.submission-item.active{background:#f0f5fb}
.submission-item>div:nth-child(2){flex:1}
.submission-item strong{display:block;font-size:11px}
.submission-item small{font-size:9px;color:var(--muted)}
.answer-box{background:#f6f8fa;border:1px solid var(--border);border-radius:8px;padding:15px}
.answer-box strong{font-size:11px}
.answer-box p{font-size:11px;line-height:1.8;white-space:pre-wrap;margin:10px 0}
.text-link{border:0;background:transparent;color:var(--blue);font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px}
.result-card{display:flex;align-items:center;gap:13px;padding:16px 0;border-bottom:1px solid #edf0f4}
.result-score{margin-left:auto;text-align:center}
.result-score strong{display:block;font-size:23px;color:var(--blue)}
.result-score small{font-size:9px;color:var(--muted)}
.feedback-text{font-size:10px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.distribution{display:flex;flex-direction:column;gap:18px;padding:15px 0}
.distribution-row{display:grid;grid-template-columns:90px 1fr 25px;gap:12px;align-items:center;font-size:10px}
.bar-track{height:9px;background:#edf1f5;border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#4d83c5,#79a8dc);border-radius:20px}
.app-shell{min-height:100vh}
.sidebar{
  width:245px;position:fixed;inset:0 auto 0 0;background:var(--navy);
  color:white;padding:25px 15px;display:flex;flex-direction:column;z-index:50
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 9px;font-size:19px;font-weight:800;letter-spacing:2px;margin-bottom:43px}
.sidebar-brand .brand-mark{background:#3569a8}
.sidebar-label{font-size:9px;color:#9fb3c7;letter-spacing:1.5px;font-weight:700;padding:0 12px;margin-bottom:13px}
.sidebar-nav{display:flex;flex-direction:column;gap:5px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px;
  border-radius:6px;color:#d4deea;font-size:11px;font-weight:600
}
.nav-item:hover{background:#ffffff12;color:white}
.nav-item.active{background:#eaf0f6;color:var(--navy)}
.nav-icon{width:19px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff20;padding-top:17px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:0 7px;margin-bottom:15px}
.avatar{
  width:34px;height:34px;border-radius:50%;background:#dce8f4;
  color:var(--navy);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0
}
.sidebar-user strong{display:block;font-size:10px}
.sidebar-user small{display:block;color:#a9bbcd;font-size:9px;margin-top:4px}
.logout{
  border:0;background:transparent;color:#d4deea;
  display:flex;align-items:center;gap:10px;padding:10px;width:100%;
  font-size:11px;border-radius:6px
}
.logout:hover{background:#ffffff12}
.main-area{margin-left:245px;min-height:100vh}
.topbar{
  height:68px;background:white;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;padding:0 30px;
  display:flex;justify-content:space-between;align-items:center
}
.breadcrumb{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:9px}
.breadcrumb strong{color:var(--navy);letter-spacing:1px}
.topbar-right{display:flex;align-items:center;gap:20px}
.topbar-profile{display:flex;align-items:center;gap:9px}
.topbar-profile strong{display:block;font-size:10px}
.topbar-profile small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.notification{border:0;background:white;font-size:18px;color:#68778a}
.page-content{padding:28px 30px;max-width:1500px;margin:auto}
.mobile-menu{display:none;border:0;background:transparent;font-size:22px}
.overlay{display:none}
.loading{min-height:150px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.spinner{
  width:28px;height:28px;border:3px solid #e5eaf0;border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:25px;right:25px;z-index:200;
  background:var(--navy);color:white;padding:14px 19px;
  border-radius:8px;box-shadow:0 8px 30px #0002;font-size:11px;
  max-width:360px
}
.landing{background:white;min-height:100vh}
.landing-nav{
  height:75px;max-width:1250px;margin:auto;padding:0 30px;
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)
}
.landing-links{display:flex;gap:30px;font-size:11px;color:#68778a;font-weight:600}
.hero{
  max-width:1250px;margin:auto;min-height:580px;padding:65px 35px;
  display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:50px
}
.hero h1{font-size:57px;line-height:1.1;color:var(--navy);margin:15px 0 20px}
.hero h1 span{color:var(--blue)}
.hero p{font-size:14px;color:var(--muted);line-height:1.9;max-width:470px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}
.hero-foot{font-size:10px;color:#8a96a4;margin-top:35px}
.hero-preview{
  background:linear-gradient(145deg,#183653,#345d84);padding:13px;
  border-radius:13px;box-shadow:0 25px 60px #18365330
}
.preview-head{display:flex;justify-content:space-between;color:white;font-size:9px;padding:10px 8px 14px;letter-spacing:1px}
.preview-window{display:flex;background:white;border-radius:8px;overflow:hidden;min-height:340px}
.preview-side{width:55px;background:#1c3b59;color:white;display:flex;align-items:center;flex-direction:column;gap:22px;padding:17px 0}
.preview-side span{font-size:17px}
.preview-main{flex:1;padding:23px}
.preview-main h3{font-size:20px;margin:7px 0}
.preview-main p{font-size:10px;margin-bottom:15px}
.preview-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preview-stat{border:1px solid var(--border);padding:11px;border-radius:7px}
.preview-stat small{font-size:9px;color:var(--muted)}
.preview-stat strong{display:block;font-size:20px;margin-top:7px}
.preview-panel{border:1px solid var(--border);padding:14px;border-radius:7px;margin-top:12px}

function date(value){
  if(!value) return "-";
  return new Date(value).toLocaleString("id-ID",{
    day:"2-digit",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

function rupiah(value){
  return new Intl.NumberFormat("id-ID").format(value);
}

function notify(message,type="success",options={}){
  const container=document.getElementById("toast-container");
  if(!container)return;
  const el=document.createElement("div");
  el.className="toast";
  const text=document.createElement("span");
  text.className="toast-message";
  text.textContent=message;
  el.appendChild(text);
  if(options.undoKey){
    const undo=document.createElement("button");
    undo.type="button";
    undo.className="toast-undo";
    undo.textContent="Undo";
    undo.dataset.undoDelete=options.undoKey;
    el.appendChild(undo);
    const meta=document.createElement("small");
    meta.className="toast-meta";
    meta.textContent="5 detik";
    el.appendChild(meta);
  }
  if(type==="error") el.style.background="#a83e3e";
  container.appendChild(el);
  setTimeout(()=>el.remove(),options.duration||5000);
}

function pendingForCurrentUser(){
  const userId=state.session?.user?.id;
  return readPendingDeletes().filter(x=>x.userId===userId);
}

function isPendingDeletion(type,id){
  const key=String(id);
  return pendingForCurrentUser().some(x=>x.type===type&&String(x.id)===key);
}

function dateTimeLocal(value){
  if(!value)return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return "";
  const pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function deadlinePassed(task){
  return Boolean(task?.status==="completed"||(task?.due_at&&new Date(task.due_at).getTime()<Date.now()));
}

function membershipKey(classId,studentId){
  return `${classId}:${studentId}`;
}

function filterPendingMemberships(rows){
  return rows.filter(row =>
    row.classes?.is_archived !== true &&
    !isPendingDeletion("membership", membershipKey(row.class_id, state.session.user.id))
  );
}

function showConfirm(message,onConfirm,confirmLabel="Lanjutkan"){
  const old=document.getElementById("kantora-confirm");
  if(old)old.remove();
  state.confirmCallback=onConfirm;
  const modal=document.createElement("div");
  modal.id="kantora-confirm";
  modal.className="confirm-backdrop";
  modal.innerHTML=`<div class="confirm-dialog" role="dialog" aria-modal="true">
    <h3>Konfirmasi</h3>
    <p>${esc(message)}</p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-secondary" data-confirm-cancel>Batal</button>
      <button type="button" class="btn btn-primary" data-confirm-accept>${esc(confirmLabel)}</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function showUndoToast(item,message){
  const remaining=Math.max(1000,item.expiresAt-Date.now());
  notify(message,"success",{undoKey:item.key,duration:remaining});
}

function removePendingItem(key){
  const rows=readPendingDeletes().filter(x=>x.key!==key);
  writePendingDeletes(rows);
  if(state.pendingTimers[key])clearTimeout(state.pendingTimers[key]);
  delete state.pendingTimers[key];
}

async function undoPendingDeletion(key){
  const item=readPendingDeletes().find(x=>x.key===key);
  if(!item)return;
  try{
    if(item.userId!==state.session?.user?.id)throw new Error("Aksi ini dibuat oleh akun lain.");
    if(item.type==="class"){
      await query(sb.from("classes").update({is_archived:Boolean(item.meta?.wasArchived)}).eq("id",item.id));
    }else if(item.type==="assignment"){
      await query(sb.from("assignments").update({status:item.meta?.previousStatus||"draft"}).eq("id",item.id));
    }else if(item.type==="membership"){
      await query(sb.rpc("kantora_restore_class_member",{
        p_class_id:item.meta.classId,
        p_student_id:item.meta.studentId
      }));
    }
    removePendingItem(key);
    notify("Penghapusan dibatalkan. Data berhasil dipulihkan.");
    await render();
  }catch(error){fail(error);}
}

async function removeStoragePaths(paths){
  const clean=[...new Set((paths||[]).filter(Boolean))];
  if(!clean.length)return;
  const {error}=await sb.storage.from("kantora-private").remove(clean);
  if(error)console.warn("Berkas tidak dapat dihapus dari penyimpanan:",error.message);
}

async function permanentlyDeleteAssignment(assignmentId){
  const [files,submissions,criteria,questions]=await Promise.all([
    query(sb.from("assignment_files").select("id,storage_path").eq("assignment_id",assignmentId)),
    query(sb.from("submissions").select("id,submitted_file_path").eq("assignment_id",assignmentId)),
    query(sb.from("rubric_criteria").select("id").eq("assignment_id",assignmentId)),
    query(sb.from("quiz_questions").select("id").eq("assignment_id",assignmentId))
  ]);

  const submissionIds=submissions.map(x=>x.id);
  const criterionIds=criteria.map(x=>x.id);
  const questionIds=questions.map(x=>x.id);

  await removeStoragePaths([
    ...files.map(x=>x.storage_path),
    ...submissions.map(x=>x.submitted_file_path)
  ]);

  if(submissionIds.length){
    await query(sb.from("submission_rubric_scores").delete().in("submission_id",submissionIds));
    await query(sb.from("submission_grades").delete().in("submission_id",submissionIds));
    await query(sb.from("submissions").delete().in("id",submissionIds));
  }
  if(criterionIds){
    if(criterionIds.length)await query(sb.from("submission_rubric_scores").delete().in("criterion_id",criterionIds));
    if(criterionIds.length)await query(sb.from("rubric_criteria").delete().in("id",criterionIds));
  }
  if(questionIds.length){
    await query(sb.from("quiz_answer_keys").delete().in("question_id",questionIds));
    await query(sb.from("quiz_options").delete().in("question_id",questionIds));
    await query(sb.from("quiz_questions").delete().in("id",questionIds));
  }
  if(files.length)await query(sb.from("assignment_files").delete().in("id",files.map(x=>x.id)));
  await query(sb.from("assignments").delete().eq("id",assignmentId));
}

async function finalizePendingDeletion(item){
  if(!state.session||item.userId!==state.session.user.id)return;
  const current=readPendingDeletes().find(x=>x.key===item.key);
  if(!current)return;
  if(current.expiresAt>Date.now()){
    schedulePendingDeletion(current);
    return;
  }
  try{
    switch(item.type){
      case "class":{
        const linked=await query(sb.from("assignments").select("id").eq("class_id",item.id));
        for(const assignment of linked){
          await permanentlyDeleteAssignment(assignment.id);
        }
        await query(sb.from("class_members").delete().eq("class_id",item.id));
        await query(sb.from("classes").delete().eq("id",item.id));
        if(state.selectedClassId===item.id)state.selectedClassId="";
        break;
      }
      case "membership":{
        // Hapus catatan Undo di database setelah jendela 5 detik berakhir.
        await query(sb.rpc("kantora_finalize_class_member_removal",{
          p_class_id:item.meta.classId,
          p_student_id:item.meta.studentId
        }));
        break;
      }
      case "assignment":{
        await permanentlyDeleteAssignment(item.id);
        break;
      }
      case "material":{
        const row=await query(sb.from("materials").select("storage_path").eq("id",item.id).single());
        await removeStoragePaths([row.storage_path]);
        await query(sb.from("materials").delete().eq("id",item.id));
        break;
      }
      case "submission":{
        const row=await query(sb.from("submissions").select("submitted_file_path").eq("id",item.id).single());
        await query(sb.from("submission_rubric_scores").delete().eq("submission_id",item.id));
        await query(sb.from("submission_grades").delete().eq("submission_id",item.id));
        await query(sb.from("submissions").delete().eq("id",item.id));
        await removeStoragePaths([row.submitted_file_path]);
        break;
      }
      case "assignment_file":{
        const row=await query(sb.from("assignment_files").select("storage_path").eq("id",item.id).single());
        await query(sb.from("assignment_files").delete().eq("id",item.id));
        await removeStoragePaths([row.storage_path]);
        break;
      }
    }
    removePendingItem(item.key);
    notify("Data telah dihapus permanen.");
    await render();
  }catch(error){
    if(item.type==="class"){
      try{await query(sb.from("classes").update({is_archived:Boolean(item.meta?.wasArchived)}).eq("id",item.id));}catch(_){}
    }
    if(item.type==="assignment"){
      try{await query(sb.from("assignments").update({status:item.meta?.previousStatus||"draft"}).eq("id",item.id));}catch(_){}
    }
    removePendingItem(item.key);
    fail(error);
    await render();
  }
}

function schedulePendingDeletion(item){
  if(!state.session||item.userId!==state.session.user.id)return;
  if(state.pendingTimers[item.key])clearTimeout(state.pendingTimers[item.key]);
  const remaining=Math.max(0,item.expiresAt-Date.now());
  state.pendingTimers[item.key]=setTimeout(()=>finalizePendingDeletion(item),remaining);
}

async function queueDeletion(type,id,meta={},message="Data akan dihapus dalam 5 detik."){
  const userId=state.session?.user?.id;
  if(!userId)throw new Error("Sesi pengguna tidak tersedia.");
  const existing=readPendingDeletes().find(x=>x.userId===userId&&x.type===type&&String(x.id)===String(id));
  if(existing){
    showUndoToast(existing,message);
    return;
  }

  const item={
    key:crypto.randomUUID(),
    type,
    id:String(id),
    meta,
    userId,
    createdAt:Date.now(),
    expiresAt:Date.now()+DELETE_DELAY_MS
  };
  const rows=readPendingDeletes();
  rows.push(item);
  writePendingDeletes(rows);

  try{
    if(type==="class"){
      await query(sb.from("classes").update({is_archived:true}).eq("id",id));
    }else if(type==="assignment"){
      await query(sb.from("assignments").update({status:"archived"}).eq("id",id));
    }else if(type==="membership"){
      await query(sb.rpc("kantora_remove_class_member",{
        p_class_id:meta.classId,
        p_student_id:meta.studentId
      }));
    }
  }catch(error){
    removePendingItem(item.key);
    throw error;
  }

  schedulePendingDeletion(item);
  showUndoToast(item,message);
  await render();
}

async function resumePendingDeletions(){
  if(!state.session)return;
  const items=pendingForCurrentUser();
  for(const item of items){
    if(item.expiresAt<=Date.now())await finalizePendingDeletion(item);
    else{
      schedulePendingDeletion(item);
      showUndoToast(item,`Penghapusan tertunda. Kamu masih bisa memulihkan data ini.`);
    }
  }
}

  try{
    const parsed=JSON.parse(raw);
    if(parsed?.kind==="kantora_quiz"&&Array.isArray(parsed.answers)){
      return `<div class="quiz-answer-summary">${parsed.answers.map((a,i)=>`

          <p>${esc(a.answer||"Belum dijawab")}</p></div>`).join("")}</div>`;

function gradeRows(value) {
  return Array.isArray(value)
    ? value
    : value
      ? [value]
      : [];
}


const KANTORA_ANALYSIS_MARKER = /<!--KANTORA_ANALYSIS_V1:([\s\S]*?)-->/;

function unpackGradeFeedback(value){
  const raw=String(value||"");
  const match=raw.match(KANTORA_ANALYSIS_MARKER);
  let analysis=null;
  if(match){
    try{analysis=JSON.parse(decodeURIComponent(match[1]));}
    catch(error){console.warn("Metadata evaluasi tidak dapat dibaca:",error);}
  }
  return {
    text:raw.replace(KANTORA_ANALYSIS_MARKER,"").trim(),
    analysis
  };
}

function packGradeFeedback(feedback,analysis){
  const clean=String(feedback||"").replace(KANTORA_ANALYSIS_MARKER,"").trim();
  if(!analysis)return clean;
  const metadata=`<!--KANTORA_ANALYSIS_V1:${encodeURIComponent(JSON.stringify(analysis))}-->`;
  return `${clean}${clean?"\n\n":""}${metadata}`;
}

function normalizeScoringText(value){
  return String(value||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

const SCORING_STOP_WORDS=new Set([
  "yang","dan","atau","dengan","untuk","dari","pada","dalam","oleh","secara",
  "adalah","agar","karena","jika","maka","serta","ini","itu","tersebut",
  "siswa","peserta","didik","anda","kamu","mereka","dapat","mampu","harus",
  "akan","telah","sudah","belum","lebih","kurang","sebuah","suatu","setiap",
  "tentang","terhadap","antara","melalui","sesuai","berdasarkan","sebagai",
  "melakukan","membuat","memberikan","menjelaskan","menentukan","menyebutkan",
  "menguraikan","menyajikan","menunjukkan","menerapkan","menyusun","menilai",
  "jawaban","hasil","pekerjaan","tugas","aspek","kriteria","penilaian"
]);
const SCORING_GENERIC_WORDS=new Set([
  "ketepatan","kesesuaian","kelengkapan","kualitas","kemampuan","pemahaman",
  "analisis","jawaban","lengkap","tepat","baik","benar","jelas","logis",
  "sesuai","mampu","dapat","secara","kriteria","aspek","hasil"
]);

function scoringKeywords(value){
  const words=normalizeScoringText(value).split(" ").filter(word=>word.length>=4);
  let useful=[...new Set(words.filter(word=>
    !SCORING_STOP_WORDS.has(word)&&!SCORING_GENERIC_WORDS.has(word)
  ))];
  if(!useful.length){
    useful=[...new Set(words.filter(word=>!SCORING_STOP_WORDS.has(word)))];
  }
  return useful;
}

function scoringTermMatches(left,right){
  if(left===right)return true;
  if(Math.min(left.length,right.length)>=5){
    return left.includes(right)||right.includes(left);
  }
  return false;
}

function keywordCoverage(keywords,answerTokens){
  if(!keywords.length)return {matched:[],percent:0};
  const matched=keywords.filter(keyword=>
    answerTokens.some(token=>scoringTermMatches(keyword,token))
  );
  return {matched,percent:matched.length/keywords.length*100};
}

function rubricQuestionOverlap(criterion,question){
  const criteriaTokens=scoringKeywords(`${criterion.criterion_name||""} ${criterion.description||""}`);
  const questionTokens=scoringKeywords(question.question_text||"");
  if(!criteriaTokens.length||!questionTokens.length)return 0;
  return criteriaTokens.filter(token=>
    questionTokens.some(q=>scoringTermMatches(token,q))
  ).length/criteriaTokens.length;
}

async function loadQuizEvaluationDetails(assignmentId){
  const questions=await query(sb.from("quiz_questions")
    .select("id,assignment_id,question_text,question_order,points")
    .eq("assignment_id",assignmentId).order("question_order"));
  if(!questions.length)return {questions:[],keysByQuestion:{},optionsByQuestion:{}};

  const questionIds=questions.map(q=>q.id);
  const [keys,options]=await Promise.all([
    query(sb.from("quiz_answer_keys")
      .select("question_id,correct_option_id").in("question_id",questionIds)),
    query(sb.from("quiz_options")
      .select("id,question_id,option_text,option_order").in("question_id",questionIds))
  ]);
  return {
    questions,
    keysByQuestion:Object.fromEntries(keys.map(x=>[x.question_id,x])),
    optionsByQuestion:options.reduce((map,option)=>{
      (map[option.question_id] ||= []).push(option);
      return map;
    },{})
  };
}

function buildAutomaticEvaluation(assignment,submission,criteria,quizDetails={}){
  const maxScore=Number(assignment?.max_score||100);
  const criterionScores={};
  const items=[];

  if(assignment?.type==="quiz"){
    const questions=quizDetails.questions||[];
    if(!questions.length)return null;
    const answers=storedQuizAnswers(submission);
    const questionRows=[];
    for(const question of questions){
      const key=quizDetails.keysByQuestion?.[question.id];
      if(!key?.correct_option_id)return null;
      const options=quizDetails.optionsByQuestion?.[question.id]||[];
      const selectedId=answers[question.id]||"";
      const selectedOption=options.find(option=>option.id===selectedId);
      const correctOption=options.find(option=>option.id===key.correct_option_id);
      const points=Math.max(0,Number(question.points||1));
      const correct=Boolean(selectedId&&selectedId===key.correct_option_id);
      questionRows.push({
        id:question.id,
        name:question.question_text,
        question_order:question.question_order,
        earned:correct?points:0,
        max_points:points,
        percent:correct?100:0,
        correct,
        selected_answer:selectedOption?.option_text||"Belum dijawab",
        correct_answer:correctOption?.option_text||"Kunci jawaban tersedia"
      });
    }

    const totalPoints=questionRows.reduce((sum,row)=>sum+row.max_points,0);
    if(totalPoints<=0)return null;
    const earnedPoints=questionRows.reduce((sum,row)=>sum+row.earned,0);
    const overallPercent=earnedPoints/totalPoints*100;

    for(const criterion of criteria||[]){
      const related=questions
        .map(question=>({
          question,
          result:questionRows.find(row=>row.id===question.id),
          overlap:rubricQuestionOverlap(criterion,question)
        }))
        .filter(row=>row.overlap>0);
      const percent=related.length
        ?related.reduce((sum,row)=>sum+row.result.percent,0)/related.length
        :overallPercent;
      const earned=Math.round(Number(criterion.max_points||0)*percent)/100;
      criterionScores[criterion.id]=earned;
      items.push({
        kind:"criterion",
        id:criterion.id,
        name:criterion.criterion_name,
        earned,
        max_points:Number(criterion.max_points||0),
        percent,
        related_questions:related.map(row=>row.question.question_text)
      });
    }

    questionRows.forEach(row=>items.push({
      kind:"question",
      id:row.id,
      name:row.name,
      question_order:row.question_order,
      earned:row.earned,
      max_points:row.max_points,
      percent:row.percent,
      correct:row.correct,
      selected_answer:row.selected_answer,
      correct_answer:row.correct_answer
    }));

    let score;
    if(criteria?.length){
      const maxRubric=criteria.reduce((sum,c)=>sum+Number(c.max_points||0),0);
      const earnedRubric=criteria.reduce((sum,c)=>sum+Number(criterionScores[c.id]||0),0);
      score=maxRubric>0?(earnedRubric/maxRubric)*maxScore:(overallPercent/100)*maxScore;
    }else{
      score=(overallPercent/100)*maxScore;
    }
    score=Math.round(score*100)/100;

    const strongest=questionRows.filter(row=>row.correct).map(row=>`Soal ${row.question_order}`);
    const weakest=questionRows.filter(row=>!row.correct).map(row=>`Soal ${row.question_order}`);
    const feedback=[
      "Evaluasi otomatis kuis dihitung dari kecocokan jawaban dengan kunci jawaban.",
      strongest.length?`Kekuatan: ${strongest.join(", ")}.`:"Belum ada jawaban benar pada percobaan ini.",
      weakest.length?`Perlu ditingkatkan: ${weakest.join(", ")}.`:"Seluruh soal dijawab benar."
    ].join(" ");
    return {
      score,
      criterionScores,
      feedback,
      analysis:{version:1,assignment_type:"quiz",items}
    };
  }

  const answerText=[
    submission?.response_text||"",
    submission?.external_completion_note||""
  ].filter(Boolean).join("\n").trim();
  if(!answerText||!criteria?.length)return null;

  const answerTokens=normalizeScoringText(answerText).split(" ").filter(Boolean);
  const scoredCriteria=[];
  for(const criterion of criteria){
    const keywords=scoringKeywords(`${criterion.criterion_name||""} ${criterion.description||""}`);
    if(!keywords.length)continue;
    const coverage=keywordCoverage(keywords,answerTokens);
    const max=Number(criterion.max_points||0);
    const earned=Math.round(max*coverage.percent)/100;
    criterionScores[criterion.id]=earned;
    const item={
      kind:"criterion",
      id:criterion.id,
      name:criterion.criterion_name,
      earned,
      max_points:max,
      percent:coverage.percent,
      matched_keywords:coverage.matched,
      expected_keywords:keywords
    };
    items.push(item);
    scoredCriteria.push(item);
  }
  if(!scoredCriteria.length)return null;

  const maxPoints=scoredCriteria.reduce((sum,item)=>sum+item.max_points,0);
  if(maxPoints<=0)return null;
  const earnedPoints=scoredCriteria.reduce((sum,item)=>sum+item.earned,0);
  const score=Math.round((earnedPoints/maxPoints)*maxScore*100)/100;
  const strongest=scoredCriteria.filter(item=>item.percent>=70).map(item=>item.name);
  const weakest=scoredCriteria.filter(item=>item.percent<50).map(item=>item.name);
  const feedback=[
    "Evaluasi otomatis awal menggunakan kecocokan kata kunci dari nama dan deskripsi rubrik; guru perlu meninjau hasilnya.",
    strongest.length?`Kekuatan yang terdeteksi: ${strongest.join(", ")}.`:"Belum ada kriteria yang mencapai kecocokan kata kunci 70%.",
    weakest.length?`Perlu diperkuat: ${weakest.join(", ")}.`:"Tidak ada kriteria dengan kecocokan di bawah 50%."
  ].join(" ");
  return {
    score,
    criterionScores,
    feedback,
    analysis:{version:1,assignment_type:assignment.type||"case",items}
  };
}

async function loadTeacherPerformanceDetails(assignments,submissions){
  const assignmentIds=assignments.map(a=>a.id);
  const submissionIds=submissions.map(s=>s.id);
  const [criteria,rubricScores]=await Promise.all([
    assignmentIds.length
      ?query(sb.from("rubric_criteria")
        .select("id,assignment_id,criterion_name,description,max_points,criterion_order")
        .in("assignment_id",assignmentIds).order("criterion_order"))
      :Promise.resolve([]),
    submissionIds.length
      ?query(sb.from("submission_rubric_scores")
        .select("submission_id,criterion_id,score").in("submission_id",submissionIds))
      :Promise.resolve([])
  ]);
  return {
    criteria,
    rubricScores,
    assignmentsById:Object.fromEntries(assignments.map(a=>[a.id,a]))
  };
}


async function loadStudentPerformanceDetails(assignments,submissions){
  const assignmentIds=assignments.map(a=>a.id);
  const submissionIds=submissions.map(s=>s.id);
  const base={
    criteria:[],
    rubricScores:[],
    assignmentsById:Object.fromEntries(assignments.map(a=>[a.id,a]))
  };
  if(!assignmentIds.length||!submissionIds.length)return base;
  try{
    const [criteria,rubricScores]=await Promise.all([
      query(sb.from("rubric_criteria")
        .select("id,assignment_id,criterion_name,description,max_points,criterion_order")
        .in("assignment_id",assignmentIds).order("criterion_order")),
      query(sb.from("submission_rubric_scores")
        .select("submission_id,criterion_id,score").in("submission_id",submissionIds))
    ]);
    return {...base,criteria,rubricScores};
  }catch(error){
    console.warn("Rincian rubrik tidak dapat dibaca dari akun siswa; grafik utama tetap tersedia.",error);
    return base;
  }
}

function submissionAnalysisItems(submission,details=null){
  const grade=gradeRows(submission?.submission_grades).find(row=>row.is_published);
  if(!grade)return [];
  const parsed=unpackGradeFeedback(grade.feedback);
  const savedItems=parsed.analysis?.items;
  let items=Array.isArray(savedItems)?savedItems.map(item=>({
    ...item,
    assignment_id:submission.assignment_id,
    assignment_title:details?.assignmentsById?.[submission.assignment_id]?.title||submission.assignments?.title||"",
    assignment_type:details?.assignmentsById?.[submission.assignment_id]?.type||submission.assignments?.type||""
  })):[];
  const hasSavedCriteria=items.some(item=>item.kind==="criterion");
  if(details?.criteria?.length&&!hasSavedCriteria){
    const scoreMap=Object.fromEntries(
      details.rubricScores
        .filter(row=>row.submission_id===submission.id)
        .map(row=>[row.criterion_id,Number(row.score)])
    );
    const assignmentCriteria=details.criteria.filter(c=>c.assignment_id===submission.assignment_id);
    items.push(...assignmentCriteria
      .filter(c=>scoreMap[c.id]!==undefined)
      .map(c=>({
        kind:"criterion",
        id:c.id,
        name:c.criterion_name,
        earned:scoreMap[c.id],
        max_points:Number(c.max_points||0),
        percent:Number(c.max_points)>0?scoreMap[c.id]/Number(c.max_points)*100:0,
        assignment_id:submission.assignment_id,
        assignment_title:details.assignmentsById?.[submission.assignment_id]?.title||"",
        assignment_type:details.assignmentsById?.[submission.assignment_id]?.type||""
      })));
  }
  return items.filter(item=>Number.isFinite(Number(item.percent)));
}

function aggregateAnalysisItems(submissions,details=null){
  const map=new Map();
  for(const submission of submissions){
    for(const item of submissionAnalysisItems(submission,details)){
      const key=`${submission.assignment_id}:${item.kind}:${item.id||item.name}`;
      if(!map.has(key)){
        map.set(key,{
          ...item,
          total:0,
          count:0
        });
      }
      const current=map.get(key);
      current.total+=Math.max(0,Math.min(100,Number(item.percent)||0));
      current.count++;
    }
  }
  return [...map.values()].map(item=>({
    ...item,
    percent:item.count?item.total/item.count:0
  }));
}

function renderAnalysisItems(items,emptyMessage="Belum ada rincian soal atau kriteria yang dapat dianalisis."){
  if(!items?.length)return `<p class="analysis-empty">${esc(emptyMessage)}</p>`;
  const sorted=[...items].sort((a,b)=>Number(b.percent)-Number(a.percent));
  const strongest=sorted.slice(0,Math.min(3,sorted.length));
  const weakest=[...sorted].reverse().slice(0,Math.min(3,sorted.length));
  const renderColumn=(title,rows,emptyText)=>`
    <div class="analysis-column">
      <h4>${title}</h4>
      ${rows.length?rows.map(item=>{
        const percent=Math.max(0,Math.min(100,Number(item.percent)||0));
        const kind=item.kind==="question"?"SOAL":"KRITERIA RUBRIK";
        const meta=[
          item.assignment_title||"",
          item.count?`${item.count} pengumpulan`:"",
          item.kind==="question"&&item.correct===false?"Jawaban perlu ditinjau":""
        ].filter(Boolean).join(" · ");
        return `<div class="analysis-entry">
          <div class="analysis-entry-top">
            <strong>${esc(item.name||"Komponen evaluasi")}</strong>
            <span>${Math.round(percent)}%</span>
          </div>
          <small>${esc(kind)}${meta?` · ${esc(meta)}`:""}</small>
          <div class="analysis-progress"><span style="width:${percent}%"></span></div>
        </div>`;
      }).join(""):`<p class="analysis-empty">${esc(emptyText)}</p>`}
    </div>`;
  const summaryStrong=strongest[0];
  const summaryWeak=weakest[0];
  const summary=`Paling kuat: ${summaryStrong?.name||"belum tersedia"} (${Math.round(summaryStrong?.percent||0)}%). Area yang paling perlu diperhatikan: ${summaryWeak?.name||"belum tersedia"} (${Math.round(summaryWeak?.percent||0)}%).`;
  return `<p class="report-intro">${esc(summary)} Persentase menunjukkan rata-rata capaian pada soal atau kriteria yang tersimpan.</p>
    <div class="analysis-grid">
      ${renderColumn("Kekuatan yang terlihat",strongest,"Belum ada data kekuatan.")}
      ${renderColumn("Area yang perlu ditingkatkan",weakest,"Belum ada area perbaikan.")}
    </div>`;
}

function renderTrendChart(points,emptyMessage="Grafik akan muncul setelah tersedia nilai yang dipublikasikan."){
  if(!points?.length)return `<div class="trend-chart"><p class="analysis-empty">${esc(emptyMessage)}</p></div>`;
  const width=Math.max(500,points.length*105);
  const height=230;
  const left=42,right=18,top=18,bottom=52;
  const plotWidth=width-left-right;
  const plotHeight=height-top-bottom;
  const xAt=index=>points.length===1?left+plotWidth/2:left+(index/(points.length-1))*plotWidth;
  const yAt=value=>top+(100-Math.max(0,Math.min(100,Number(value)||0)))/100*plotHeight;
  const grid=[0,25,50,75,100].map(value=>{
    const y=yAt(value);
    return `<line class="grid-line" x1="${left}" y1="${y}" x2="${width-right}" y2="${y}"/>
      <text class="axis-label" x="${left-8}" y="${y+3}" text-anchor="end">${value}</text>`;
  }).join("");
  const line=points.map((point,index)=>`${xAt(index)},${yAt(point.value)}`).join(" ");
  const dots=points.map((point,index)=>{
    const x=xAt(index),y=yAt(point.value);
    const label=String(point.label||"").length>16?`${String(point.label).slice(0,15)}…`:String(point.label||"");
    return `<g><title>${esc(point.label||"Penugasan")}: ${Math.round(point.value)}%</title>
      <circle class="trend-point" cx="${x}" cy="${y}" r="5"/>
      <text class="point-label" x="${x}" y="${height-25}" text-anchor="middle">${esc(label)}</text>
      <text class="axis-label" x="${x}" y="${y-10}" text-anchor="middle">${Math.round(point.value)}%</text>
    </g>`;
  }).join("");
  return `<div class="trend-chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Grafik tren nilai">
    ${grid}<polyline class="trend-line" points="${line}"/>${dots}
  </svg></div>`;
}

function trendNarrative(points,subject="Perkembangan"){
  if(!points?.length)return "Belum ada nilai terpublikasi untuk membentuk tren.";
  if(points.length===1)return `Baru ada satu data penilaian (${Math.round(points[0].value)}%). Grafik akan menunjukkan arah perubahan setelah penilaian berikutnya dipublikasikan.`;
  const previous=points[points.length-2];
  const current=points[points.length-1];
  const delta=Number(current.value)-Number(previous.value);
  if(delta>1){
    return `${subject} naik ${delta.toFixed(1)} poin persentase dari "${previous.label}" (${Math.round(previous.value)}%) ke "${current.label}" (${Math.round(current.value)}%).`;
  }
  if(delta< -1){
    return `${subject} turun ${Math.abs(delta).toFixed(1)} poin persentase dari "${previous.label}" (${Math.round(previous.value)}%) ke "${current.label}" (${Math.round(current.value)}%). Periksa rincian soal atau kriteria di bawah untuk melihat area yang paling berpengaruh.`;
  }
  return `${subject} relatif stabil: ${Math.round(previous.value)}% pada "${previous.label}" dan ${Math.round(current.value)}% pada "${current.label}".`;
}


function trendItemExplanation(points,submissions,details=null){
  if(!points?.length)return "";
  const current=points[points.length-1];
  const previous=points.length>1?points[points.length-2]:null;
  const currentSubmissions=submissions.filter(row=>row.assignment_id===current.id);
  const previousSubmissions=previous
    ?submissions.filter(row=>row.assignment_id===previous.id)
    :[];
  const currentItems=aggregateAnalysisItems(currentSubmissions,details);
  const previousItems=aggregateAnalysisItems(previousSubmissions,details);
  if(!currentItems.length){
    return "Rincian penyebab perubahan belum tersedia untuk penugasan terbaru. Setelah evaluasi otomatis atau skor rubrik dipublikasikan, sistem dapat menunjukkan soal atau kriteria yang kuat dan lemah.";
  }

  const kindLabel=kind=>kind==="question"?"soal kuis":"kriteria rubrik";
  const averageByKind=items=>{
    const groups={};
    for(const item of items){
      (groups[item.kind] ||= []).push(Number(item.percent)||0);
    }
    return Object.fromEntries(Object.entries(groups).map(([kind,values])=>[
      kind,values.reduce((a,b)=>a+b,0)/values.length
    ]));
  };
  const currentKinds=averageByKind(currentItems);
  const previousKinds=averageByKind(previousItems);
  const changes=[];
  if(previous){
    for(const [kind,value] of Object.entries(currentKinds)){
      if(previousKinds[kind]===undefined)continue;
      const delta=value-previousKinds[kind];
      if(delta>1)changes.push(`${kindLabel(kind)} naik ${delta.toFixed(1)} poin`);
      else if(delta< -1)changes.push(`${kindLabel(kind)} turun ${Math.abs(delta).toFixed(1)} poin`);
      else changes.push(`${kindLabel(kind)} relatif stabil`);
    }
  }
  const weakest=[...currentItems].sort((a,b)=>a.percent-b.percent)[0];
  const strongest=[...currentItems].sort((a,b)=>b.percent-a.percent)[0];
  const changeText=changes.length
    ?`Dibanding penugasan sebelumnya, ${changes.join("; ")}. `
    :"";
  return `${changeText}Pada penugasan terbaru, bagian terkuat adalah ${kindLabel(strongest.kind)} "${strongest.name}" (${Math.round(strongest.percent)}%), sedangkan bagian yang paling perlu diperbaiki adalah ${kindLabel(weakest.kind)} "${weakest.name}" (${Math.round(weakest.percent)}%).`;
}

async function studentDashboard(){
  const user=state.session.user;

  const memberships=await query(sb.from("class_members")
    .select("class_id,classes(id,name,is_archived)")
    .eq("student_id",user.id));

  const activeMemberships=filterPendingMemberships(memberships);
  const ids=activeMemberships.map(x=>x.class_id);
  let tasks=[];

  if(ids.length){
    tasks=await query(sb.from("assignments")
      .select("id,title,type,due_at,alert_title,alert_message,status,class_id,created_at")
      .in("class_id",ids)
      .in("status",["published","completed"])
      .order("created_at",{ascending:false}));
  }

  const submissions=await query(sb.from("submissions")
    .select("id,assignment_id,submission_grades(is_published)")
    .eq("student_id",user.id));

  const submitted=submissions.map(x=>x.assignment_id);
  const graded=submissions
    .filter(x=>gradeRows(x.submission_grades).some(g=>g.is_published===true))
    .map(x=>x.assignment_id);
  const active=tasks.filter(x=>!submitted.includes(x.id)&&!deadlinePassed(x)).length;
  const latestTask=tasks[0]||null;
  const classNames=Object.fromEntries(activeMemberships.map(m=>[
    m.class_id,m.classes?.name||"Kelas"
  ]));

  return `
    ${header("Selamat datang, "+state.profile.full_name,"Siap menyelesaikan pekerjaan hari ini?")}
    ${latestTask?`
      <section class="student-alert">
        <div class="student-alert-copy">
          <div class="student-alert-kicker">${uiIcon("alert",16)} ALERT! · TUGAS TERBARU</div>
          <h2>${esc(latestTask.alert_title||latestTask.title)}</h2>
          <p>${esc(latestTask.alert_message||latestTask.description||"Ada penugasan baru yang perlu diperiksa.")}</p>
          <div class="student-alert-meta">
            <span>${uiIcon("users",13)} ${esc(classNames[latestTask.class_id]||"Kelas")}</span>
            <span>${uiIcon("clock",13)} Tenggat ${date(latestTask.due_at)}</span>
            ${graded.includes(latestTask.id)?`<span>${uiIcon("check",13)} Sudah dinilai</span>`:submitted.includes(latestTask.id)?`<span>${uiIcon("clock",13)} Menunggu penilaian</span>`:deadlinePassed(latestTask)?`<span>${uiIcon("alert",13)} Tenggat telah lewat</span>`:""}
          </div>
        </div>
        <div class="student-alert-action">
          <button class="btn btn-primary" data-task="${latestTask.id}">Kerjakan Tugas →</button>
        </div>
      </section>
    `:`
      <section class="student-alert">
        <div class="student-alert-copy">
          <div class="student-alert-kicker">${uiIcon("alert",16)} ALERT!</div>
          <h2>Belum ada penugasan terbaru</h2>
          <p>Penugasan dari guru akan tampil di bagian ini setelah dipublikasikan untuk kelas yang kamu ikuti.</p>
        </div>
      </section>
    `}
    <div class="stats-grid">
      ${stat("Kelas Diikuti",ids.length,"Kelas terdaftar",uiIcon("users",18))}
      ${stat("Tugas Aktif",active,"Belum dikumpulkan",uiIcon("clipboard",18))}
      ${stat("Tugas Selesai",submissions.length,"Sudah dikumpulkan",uiIcon("check",18))}
      ${stat("Hasil Evaluasi","Lihat","Riwayat penilaian",uiIcon("chart",18))}
    </div>
    ${panel("Penugasan Terbaru",tasks.length?`
      <div class="task-list">
        ${tasks.slice(0,5).map(x=>`
          <div class="task-row">
            <div class="task-icon">${uiIcon("file",19)}</div>
            <div class="task-info">
              <strong>${esc(x.title)}</strong>
              <small>${esc(classNames[x.class_id]||"Kelas")} · ${esc(x.type.toUpperCase())} · Tenggat ${date(x.due_at)}</small>
            </div>
            ${graded.includes(x.id)?badge("graded"):submitted.includes(x.id)?badge("submitted"):deadlinePassed(x)?'<span class="pending-label">Tenggat lewat</span>':`<button class="btn btn-small btn-primary" data-task="${x.id}">Kerjakan</button>`}
          </div>`).join("")}
      </div>`:empty("Belum ada penugasan","Gabung ke kelas menggunakan kode yang diberikan guru.",
        '<button class="btn btn-primary" data-page="classes">Gabung Kelas</button>'),
      "Pekerjaan yang diberikan oleh guru.")}`;
}

===================================================== */

async function teacherClasses(){
  const rows=await query(sb.from("classes")
    .select("id,name,grade_label,description,is_archived,created_at")
    .eq("teacher_id",state.session.user.id)
    .order("created_at",{ascending:false}));

  const editing=rows.find(x=>x.id===state.editingClassId)||null;
  const selected=rows.find(x=>x.id===state.selectedClassId)||null;

  const cards=await Promise.all(rows.map(async item=>{
    const {count,error}=await sb.from("class_members")
      .select("id",{count:"exact",head:true}).eq("class_id",item.id);
    if(error)throw error;
    const pending=isPendingDeletion("class",item.id);
    return `<div class="class-card">
      <button class="class-open" data-open-class="${item.id}" type="button">
        <span class="class-card-icon">${uiIcon("users",20)}</span>
        <span class="class-card-info">
          <strong>${esc(item.name)}</strong>
          <small>${esc(item.grade_label||"")} · ${count||0} siswa</small>
          ${item.is_archived&&!pending?badge("archived"):""}
          ${pending?'<span class="pending-label">Menunggu penghapusan · Undo tersedia</span>':""}
        </span>
      </button>
      <div class="class-actions">
        <button data-code="${item.id}" title="Lihat kode kelas" type="button">⌑</button>
        ${!pending?`<button data-edit-class="${item.id}" title="Edit kelas" type="button">✎</button>
        <button data-delete-class="${item.id}" title="Hapus kelas" type="button">✕</button>`:""}
      </div>
    </div>`;
  }));

  let memberContent="";
  if(selected){
    const membershipsRaw=await query(sb.from("class_members")
      .select("class_id,student_id")
      .eq("class_id",selected.id));
    const memberships=membershipsRaw.filter(m =>
      !isPendingDeletion("membership", membershipKey(selected.id, m.student_id))
    );
    const studentIds=memberships.map(x=>x.student_id);
    let profiles=[];
    if(studentIds.length){
      profiles=await query(sb.from("profiles")
        .select("id,full_name,email")
        .in("id",studentIds));
    }
    const byId=new Map(profiles.map(x=>[x.id,x]));
    const collator=new Intl.Collator("id",{sensitivity:"base"});
    const members=memberships.map(m=>({
      ...m,
      profile:byId.get(m.student_id)||{}
    })).sort((a,b)=>collator.compare(a.profile.full_name||a.profile.email||"",b.profile.full_name||b.profile.email||""));

    memberContent=`
      <section class="panel" style="margin-bottom:18px">
        <div class="panel-heading">
          <div><h3>${esc(selected.name)}</h3><p>${members.length} siswa · Daftar diurutkan berdasarkan abjad nama</p></div>
          <button class="btn btn-secondary btn-small" data-action="close-class-detail" type="button">Kembali ke daftar</button>
        </div>
        ${members.length?`
          <div class="table-wrap">
            <table class="student-table">
              <thead><tr><th>No.</th><th>Nama Siswa</th><th>Email</th><th>Status</th><th>Aksi</th></tr></thead>
              <tbody>
                ${members.map((m,i)=>{
                  const key=membershipKey(selected.id,m.student_id);
                  const pending=isPendingDeletion("membership",key);
                  return `<tr>
                    <td>${i+1}</td>
                    <td><strong>${esc(m.profile.full_name||"Nama belum tersedia")}</strong></td>
                    <td>${esc(m.profile.email||"-")}</td>
                    <td>${pending?'<span class="pending-label">Menunggu dikeluarkan</span>':'<span class="badge badge-published">Terdaftar</span>'}</td>
                    <td>${pending?'<small class="muted">Undo tersedia pada notifikasi</small>':`
                      <button class="btn btn-danger btn-small" data-remove-student="${selected.id}" data-student-id="${m.student_id}" type="button">Keluarkan</button>`}</td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`:empty("Belum ada siswa","Siswa yang bergabung melalui kode kelas akan muncul di sini.")}
      </section>`;
  }

  const codePanel=state.classCode&&state.classCodeClassId?`
    <div class="code-result">
      <span>KODE GABUNG KELAS</span>
      <strong>${esc(state.classCode)}</strong>
      <div class="inline-form-actions" style="justify-content:center">
        <button class="btn btn-secondary btn-small" data-action="copy-class-code" type="button">Salin Kode</button>
        <button class="btn btn-outline btn-small" data-action="close-class-code" type="button">Tutup</button>
      </div>
    </div>`:"";

  return `
    ${header("Kelas & Siswa","Buka kelas untuk melihat daftar siswa, mengedit informasi, atau mengelola keanggotaan.")}
    ${codePanel}
    ${memberContent}
    <div class="content-grid">
      ${panel(editing?"Edit Informasi Kelas":"Buat Kelas Baru",`
        <form id="classForm">
          <div class="field"><label>Nama Kelas</label><input name="name" required value="${esc(editing?.name||"")}" placeholder="Contoh: XII MPLB 1"></div>
          <div class="field"><label>Tingkat</label><input name="grade_label" required value="${esc(editing?.grade_label||"")}" placeholder="Contoh: XII"></div>
          <div class="form-actions">
            ${editing?'<button class="btn btn-secondary" type="button" data-action="cancel-edit-class">Batal</button>':""}
            <button class="btn btn-primary" type="submit">${editing?"Simpan Perubahan":"＋ Buat Kelas"}</button>
          </div>
        </form>
      `,editing?"Perubahan akan langsung diperbarui pada kelas yang sama.":"Setiap kelas mendapatkan ID database sendiri dan kode gabung dari sistem.")}
      ${panel("Daftar Kelas",rows.length?`
        <div class="class-list">${cards.join("")}</div>
      `:empty("Belum ada kelas","Kelas yang kamu buat akan muncul di sini."),
      `${rows.length} kelas terdaftar`)}
    </div>`;
}

async function studentAssignments(){
  const memberships=await query(sb.from("class_members")
    .select("class_id,classes(id,name,is_archived)")
    .eq("student_id",state.session.user.id));

  const activeMemberships=filterPendingMemberships(memberships);
  const ids=activeMemberships.map(x=>x.class_id);
  if(!ids.length){
    return `${header("Daftar Penugasan","Periksa pekerjaan yang diberikan guru.")}
      ${empty("Belum bergabung ke kelas","Masukkan kode kelas sebelum mengakses penugasan.",
        '<button class="btn btn-primary" data-page="classes">Gabung Kelas</button>')}`;
  }

  const [tasks,submissions]=await Promise.all([
    query(sb.from("assignments")
      .select("*").in("class_id",ids).in("status",["published","completed"])
      .order("created_at",{ascending:false})),
    query(sb.from("submissions")
      .select("id,assignment_id,submitted_at,submission_grades(is_published)")
      .eq("student_id",state.session.user.id))
  ]);

  const done=submissions.map(x=>x.assignment_id);
  const graded=submissions
    .filter(x=>gradeRows(x.submission_grades).some(g=>g.is_published===true))
    .map(x=>x.assignment_id);
  const groups=activeMemberships.map(m=>({
    id:m.class_id,
    name:m.classes?.name||"Kelas",
    tasks:tasks.filter(t=>t.class_id===m.class_id)
  }));

  return `${header("Daftar Penugasan","Penugasan dipisahkan berdasarkan kelas yang kamu ikuti.")}
    ${groups.map(group=>panel(`Kelas ${group.name}`,group.tasks.length?`
      <div class="assignment-grid">
        ${group.tasks.map(t=>{
          const submitted=done.includes(t.id);
          const isGraded=graded.includes(t.id);
          const locked=deadlinePassed(t);
          return `<article class="assignment-card">
            <div class="assignment-card-top">
              <div class="task-icon">${uiIcon("clipboard",19)}</div>
              ${isGraded?badge("graded"):submitted?badge("submitted"):locked?'<span class="pending-label">Tenggat lewat</span>':badge("published")}
            </div>
            <span class="eyebrow">${esc(t.type.toUpperCase())}</span>
            <h3>${esc(t.title)}</h3>
            <p>${esc(t.alert_message||t.description)}</p>
            <div class="assignment-deadline">${uiIcon("clock",14)} Tenggat ${date(t.due_at)}</div>
            <button class="btn btn-primary btn-block" data-task="${t.id}">
              ${submitted?(locked?"Lihat Pengumpulan":"Lihat / Edit Pengumpulan"):locked?"Lihat Detail Tugas":"Mulai Mengerjakan"} →
            </button>
          </article>`;
        }).join("")}
      </div>`:empty("Belum ada tugas untuk kelas ini","Tugas akan tampil setelah guru memublikasikannya."),`${group.tasks.length} penugasan.`)).join("")}
  `;
}

function storedQuizAnswers(submission){
  if(!submission?.response_text)return {};
  try{
    const parsed=JSON.parse(submission.response_text);
    if(parsed?.kind==="kantora_quiz"&&Array.isArray(parsed.answers)){
      return Object.fromEntries(parsed.answers.map(x=>[x.question_id,x.option_id]));
    }
    return parsed?.answers||{};
  }catch(_){return {};}
}

async function studentTask(){
  const id=state.currentTaskId;
  if(!id) throw new Error("Penugasan tidak ditemukan.");

  const task=await query(sb.from("assignments")
    .select("*").eq("id",id).in("status",["published","completed"]).single());

  const [allFiles,submission]=await Promise.all([
    query(sb.from("assignment_files").select("*").eq("assignment_id",id)),
    query(sb.from("submissions").select("*")
      .eq("assignment_id",id)
      .eq("student_id",state.session.user.id)
      .maybeSingle())
  ]);

  const files=allFiles.filter(f=>!isPendingDeletion("assignment_file",f.id));
  const locked=deadlinePassed(task);
  if(state.deadlineTimer){
    clearTimeout(state.deadlineTimer);
    state.deadlineTimer=null;
  }
  if(!locked&&task.status==="published"&&task.due_at){
    const remaining=new Date(task.due_at).getTime()-Date.now();
    if(remaining>0){
      state.deadlineTimer=setTimeout(()=>{
        state.deadlineTimer=null;
        if(state.page==="task"&&state.currentTaskId===id)render();
      },Math.min(remaining+250,2147483000));
    }
  }
  const pendingSubmission=submission&&isPendingDeletion("submission",submission.id);

  let questions=[];
  if(task.type==="quiz"){
    questions=await query(sb.from("quiz_questions")
      .select("id,question_text,question_order,points")
      .eq("assignment_id",id).order("question_order"));
    for(const q of questions){
      q.options=await query(sb.from("quiz_options")
        .select("id,option_text,option_order")
        .eq("question_id",q.id).order("option_order"));
    }
  }

  const previousAnswers=storedQuizAnswers(submission);
  const lastChanged=submission?.submitted_at||null;

  const attachmentView=submission?.submitted_file_path?`
    <div class="document-row answer-file">
      <span>${uiIcon("file",17)}</span>
      <div><strong>Lampiran hasil pengumpulan</strong><small>Berkas tetap tersedia untuk dilihat.</small></div>
      <button type="button" data-open-file="${esc(submission.submitted_file_path)}">↓ Buka</button>
    </div>`:"";

  const submittedView=submission?`
    <div class="readonly-answer">
      <strong>Jawaban yang sudah dikumpulkan</strong>
      ${task.type==="quiz"?renderSubmissionAnswer(submission.response_text):`
        <p>${esc(submission.response_text||"Tidak ada jawaban teks.")}</p>
        ${submission.external_completion_note?`<p>${esc(submission.external_completion_note)}</p>`:""}`}
      ${attachmentView}
      <small class="muted">Terakhir diperbarui: ${date(lastChanged)}</small>
    </div>`:"";

  const quizForm=`
    <form id="quizForm">
      <input type="hidden" name="assignment_id" value="${task.id}">
      ${questions.map((q,i)=>`
        <div class="quiz-question">
          <strong>${i+1}. ${esc(q.question_text)}</strong>
          <small>${q.points} poin</small>
          ${q.options.map(o=>`
            <label class="radio-option">
              <input type="radio" name="q_${q.id}" value="${o.id}" ${previousAnswers[q.id]===o.id?"checked":""} required>
              ${esc(o.option_text)}
            </label>`).join("")}
        </div>`).join("")}
      <button class="btn btn-primary btn-block" type="submit">${submission?"Simpan Perubahan Jawaban →":"Kirim Jawaban Kuis →"}</button>
    </form>`;

  const submissionForm=`
    <form id="submissionForm">
      <input type="hidden" name="assignment_id" value="${task.id}">
      ${task.type==="case"?`
        <div class="field"><label>Jawaban dan Hasil Analisis</label>
          <textarea name="response_text" rows="9" required placeholder="Tuliskan temuan, analisis, dan keputusan pekerjaan...">${esc(submission?.response_text||"")}</textarea>
        </div>
        <div class="field"><label>Lampiran Hasil (Opsional)</label><input name="file" type="file"></div>
      `:""}
      ${task.type==="file"?`
        <div class="field"><label>${submission?.submitted_file_path?"Ganti Berkas Hasil (Opsional)":"Unggah Hasil Pekerjaan"}</label>
          <input name="file" type="file" ${submission?.submitted_file_path?"":"required"}>
        </div>
      `:""}
      ${task.type==="external"?`
        <p class="muted">Kerjakan aktivitas melalui platform eksternal.</p>
        <a class="btn btn-primary btn-block" href="${esc(task.external_url)}" target="_blank" rel="noopener noreferrer">
          Buka ${esc(task.external_platform||"Platform Eksternal")} ↗
        </a>
        ${task.submission_mode!=="file"?`
          <div class="field" style="margin-top:18px"><label>Catatan Penyelesaian</label>
            <textarea name="external_completion_note" rows="4" placeholder="Tuliskan hasil pekerjaan...">${esc(submission?.external_completion_note||"")}</textarea>

        ${task.submission_mode!=="text"?`
          <div class="field"><label>${submission?.submitted_file_path?"Ganti Bukti (Opsional)":"Unggah Bukti"}</label>

      ${submission?.submitted_file_path?`
        <div class="notice success">Lampiran saat ini tetap tersimpan. Pilih berkas baru jika ingin menggantinya.</div>`:""}
      <button class="btn btn-primary btn-block" type="submit">${submission?"Simpan Perubahan Pengumpulan →":"Kirim Hasil Pekerjaan →"}</button>
    </form>`;

  let workArea="";
  if(pendingSubmission){
    workArea=`${submittedView}
      <div class="deadline-lock">Pengumpulan ini sedang menunggu penghapusan. Gunakan tombol Undo pada notifikasi untuk memulihkannya.</div>`;

      <div class="notice success">Pengumpulan sudah tersimpan. Kamu masih dapat mengedit jawaban dan mengganti lampiran sebelum tenggat.</div>

      ${submissionForm}
      ${submission?`<div class="inline-form-actions"><button type="button" class="btn btn-danger btn-small" data-delete-submission="${submission.id}">Hapus Pengumpulan</button></div>`:""}`;

  return `

      <span class="eyebrow">PENUGASAN KANTORA</span>

      <p>${esc(task.alert_message||task.description)}</p>
      <div class="task-meta">
        <span>${uiIcon("clock",14)} ${date(task.due_at)}</span>
        <span>${uiIcon("clipboard",14)} ${esc(task.type.toUpperCase())}</span>
        <span>Nilai maksimal ${task.max_score}</span>
      </div>
    </div>

    <div class="content-grid">
      <section class="panel">
        <h3>Instruksi Pekerjaan</h3>
        <div class="instruction-text">${esc(task.instructions)}</div>
        ${files.length?`
          <div class="document-list">
            <h4>Dokumen Pendukung</h4>
            ${files.map(f=>`
              <div class="document-row">

          </div>`:""}
      </section>

      <section class="panel">
        <h3>Ruang Pengerjaan</h3>
        ${workArea}

    </div>`;
}

async function teacherReview(){
  const [classes,assignments]=await Promise.all([
    query(sb.from("classes").select("id,name,grade_label")
      .eq("teacher_id",state.session.user.id)),
    query(sb.from("assignments")
      .select("id,title,max_score,class_id,type")
      .eq("teacher_id",state.session.user.id)
      .order("created_at",{ascending:false}))
  ]);

  if(!assignments.length){
    return `${header("Hasil & Evaluasi","Periksa hasil pekerjaan siswa berdasarkan kelas.")}
      ${empty("Belum ada penugasan","Buat penugasan terlebih dahulu.")}`;
  }

  if(!assignments.some(a=>a.id===state.reviewAssignmentId)){
    state.reviewAssignmentId=assignments[0].id;
  }

  const selectedAssignment=assignments.find(a=>a.id===state.reviewAssignmentId);
  const className=classes.find(c=>c.id===selectedAssignment.class_id)?.name||"Kelas tidak diketahui";

  const submissions=await query(sb.from("submissions")
    .select("*,profiles!submissions_student_id_fkey(full_name,email),submission_grades(score,feedback,is_published)")
    .eq("assignment_id",state.reviewAssignmentId)
    .order("submitted_at",{ascending:false}));

  const criteria=await query(sb.from("rubric_criteria")
    .select("*").eq("assignment_id",state.reviewAssignmentId)
    .order("criterion_order"));

  const selected=submissions.find(x=>x.id===state.selectedSubmissionId);
  const rubricScores=selected?await query(sb.from("submission_rubric_scores")
    .select("criterion_id,score").eq("submission_id",selected.id)):[];
  const scoreMap=Object.fromEntries(rubricScores.map(x=>[x.criterion_id,Number(x.score)]));
  const existingGrade=selected?gradeRows(selected.submission_grades)[0]:null;
  const existingFeedback=unpackGradeFeedback(existingGrade?.feedback);
  const quizDetails=selected&&selectedAssignment.type==="quiz"
    ?await loadQuizEvaluationDetails(selectedAssignment.id)
    :{questions:[],keysByQuestion:{},optionsByQuestion:{}};
  const autoEvaluation=selected
    ?buildAutomaticEvaluation(selectedAssignment,selected,criteria,quizDetails)
    :null;

  const totalRubricPoints=criteria.reduce((sum,c)=>sum+Number(c.max_points||0),0);
  const earnedRubricPoints=criteria.reduce((sum,c)=>sum+
    Number(scoreMap[c.id]??autoEvaluation?.criterionScores?.[c.id]??0),0);
  const autoScoreFromRubric=criteria.length&&totalRubricPoints>0
    ?Math.round((earnedRubricPoints/totalRubricPoints)*Number(selectedAssignment.max_score||100)*100)/100
    :"";
  const initialScore=existingGrade?.score??(
    rubricScores.length?autoScoreFromRubric:(autoEvaluation?.score??"")
  );
  const autoAnalysis=existingGrade?.is_published
    ?(existingFeedback.analysis||autoEvaluation?.analysis||null)
    :(autoEvaluation?.analysis||existingFeedback.analysis||null);
  const feedbackText=existingFeedback.text||autoEvaluation?.feedback||"";
  const questionRows=(autoEvaluation?.analysis?.items||[])
    .filter(item=>item.kind==="question");

  return `

      <div class="field" style="max-width:600px;margin:0">

          }).join("")}
        </select>
      </div>
      <p class="small" style="margin:12px 0 0">Kelas aktif: <strong>${esc(className)}</strong></p>
    </section>

    <div class="review-layout">
      <section class="panel">
        <div class="panel-heading">
          <div><h3>Daftar Pengumpulan</h3><p>${submissions.length} pengumpulan · ${esc(className)}</p></div>
        </div>
        ${submissions.length?submissions.map(s=>`
          <button class="submission-item ${selected?.id===s.id?"active":""}" data-select-submission="${s.id}">
            <div class="avatar">${esc((s.profiles?.full_name||"S").charAt(0).toUpperCase())}</div>
            <div><strong>${esc(s.profiles?.full_name||"Siswa")}</strong><small>Dikumpulkan ${date(s.submitted_at)}</small></div>
            ${gradeRows(s.submission_grades)[0]?.is_published?badge("graded"):badge("submitted")}
          </button>`).join(""):empty("Belum ada pengumpulan","Pengumpulan siswa dari kelas ini akan tampil di sini.")}
      </section>

      <section class="panel">
        <div class="panel-heading"><h3>Detail Penilaian</h3></div>
        ${selected?`
          <div class="answer-box">
            <strong>${esc(selected.profiles?.full_name||"Siswa")}</strong>
            <div class="small" style="margin-top:5px">Kelas ${esc(className)} · Penugasan ${esc(selectedAssignment.title)}</div>
            ${renderSubmissionAnswer(selected.response_text)}
            ${selected.external_completion_note?`<p>${esc(selected.external_completion_note)}</p>`:""}
            <small class="muted">Dikumpulkan: ${date(selected.submitted_at)}</small>
            ${selected.submitted_file_path?`
              <button class="text-link" data-open-file="${esc(selected.submitted_file_path)}">${uiIcon("download",14)} Buka Berkas Hasil</button>`:""}
          </div>
          ${autoEvaluation?`
            <div class="auto-score-panel">
              <strong>${existingGrade?.is_published?"Evaluasi otomatis tersedia sebagai pembanding":"Nilai dan evaluasi otomatis berhasil dihitung"}</strong>
              <p>Perkiraan nilai: <b>${autoEvaluation.score}</b> dari ${Number(selectedAssignment.max_score||100)}. Guru tetap dapat mengubah skor sebelum menyimpan atau memublikasikan.</p>
              ${selectedAssignment.type==="quiz"?`
                ${questionRows.map(item=>`
                  <div class="question-review-row">
                    <span>Soal ${item.question_order}: ${esc(item.name)}<br>

                  </div>`).join("")}
              `:`

            </div>
          `:`

            <input type="hidden" name="submission_id" value="${selected.id}">
            <input type="hidden" name="auto_analysis" value="${esc(autoAnalysis?encodeURIComponent(JSON.stringify(autoAnalysis)):"")}">
            ${criteria.length?`
