/* =====================================================
   TEACHER REPORTS
===================================================== */

async function teacherReports(){
  const classes=await query(sb.from("classes")
    .select("id,name,grade_label")
    .eq("teacher_id",state.session.user.id));

  if(state.reportClassId&&!classes.some(c=>c.id===state.reportClassId)){
    state.reportClassId="";
    state.reportStudentId="";
    state.reportAssignmentId="";
  }

  let assignmentQuery=sb.from("assignments")
    .select("id,title,type,class_id,max_score,created_at")
    .eq("teacher_id",state.session.user.id);
  if(state.reportClassId)assignmentQuery=assignmentQuery.eq("class_id",state.reportClassId);
  const assignments=await query(assignmentQuery.order("created_at",{ascending:true}));
  const ids=assignments.map(x=>x.id);
  let submissions=[];

  if(ids.length){
    submissions=await query(sb.from("submissions")
      .select("id,student_id,assignment_id,submitted_at,response_text,external_completion_note,profiles!submissions_student_id_fkey(full_name,email),submission_grades(score,feedback,is_published)")
      .in("assignment_id",ids)
      .order("submitted_at",{ascending:true}));
  }

  const grades=submissions
    .flatMap(s=>gradeRows(s.submission_grades))
    .filter(g=>g.is_published)
    .map(g=>Number(g.score));
  const average=grades.length?
    (grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1):"0";

  const ranges=[
    ["90–100",90,100],
    ["80–89",80,89],
    ["70–79",70,79],
    ["Di bawah 70",0,69]
  ];
  const selectedClass=classes.find(c=>c.id===state.reportClassId);
  const details=await loadTeacherPerformanceDetails(assignments,submissions);

  const sortedAssignments=[...assignments].sort((a,b)=>
    new Date(a.created_at||0)-new Date(b.created_at||0)
  );
  const classTrend=sortedAssignments.map(assignment=>{
    const rows=submissions.filter(s=>s.assignment_id===assignment.id);
    const published=rows.map(publishedGradeFor).filter(Boolean);
    if(!published.length)return null;
    const max=Number(assignment.max_score||100);
    const value=published.reduce((sum,grade)=>sum+(Number(grade.score)/max*100),0)/published.length;
    const classLabel=classes.find(c=>c.id===assignment.class_id)?.name||"Kelas";
    return {
      id:assignment.id,
      label:assignment.title,
      value,
      count:published.length,
      detail:`${classLabel} · ${assignment.type||"Penugasan"}`
    };
  }).filter(Boolean);

  const studentsMap=new Map();
  for(const submission of submissions){
    const id=submission.student_id;
    if(!id)continue;
    if(!studentsMap.has(id)){
      studentsMap.set(id,{
        id,
        name:submission.profiles?.full_name||"Siswa",
        submissions:[]
      });
    }
    studentsMap.get(id).submissions.push(submission);
  }
  const students=[...studentsMap.values()].map(person=>{
    const normalized=person.submissions.map(submission=>{
      const grade=publishedGradeFor(submission);
      const assignment=assignments.find(a=>a.id===submission.assignment_id);
      return grade
        ?Number(grade.score)/Number(assignment?.max_score||100)*100
        :null;
    }).filter(value=>value!==null&&Number.isFinite(value));
    return {
      ...person,
      count:normalized.length,
      average:normalized.length?normalized.reduce((a,b)=>a+b,0)/normalized.length:null
    };
  }).sort((a,b)=>a.name.localeCompare(b.name,"id"));

  if(state.reportStudentId&&!students.some(person=>person.id===state.reportStudentId)){
    state.reportStudentId="";
  }
  if(state.reportAssignmentId&&!assignments.some(a=>a.id===state.reportAssignmentId)){
    state.reportAssignmentId="";
  }

  const selectedStudent=students.find(person=>person.id===state.reportStudentId);
  const selectedStudentSubmissions=selectedStudent?.submissions||[];
  const studentTrend=selectedStudentSubmissions
    .map(submission=>{
      const grade=publishedGradeFor(submission);
      const assignment=assignments.find(a=>a.id===submission.assignment_id);
      if(!grade||!assignment)return null;
      return {
        id:assignment.id,
        label:assignment.title,
        value:Number(grade.score)/Number(assignment.max_score||100)*100,
        detail:assignment.type||"Penugasan"
      };
    })
    .filter(Boolean)
    .sort((a,b)=>{
      const aa=assignments.find(x=>x.id===a.id);
      const bb=assignments.find(x=>x.id===b.id);
      return new Date(aa?.created_at||0)-new Date(bb?.created_at||0);
    });

  const classAnalysis=aggregateAnalysisItems(submissions,details)
    .filter(item=>!state.reportAssignmentId||item.assignment_id===state.reportAssignmentId);
  const individualAnalysis=aggregateAnalysisItems(selectedStudentSubmissions,details);
  const selectedAssignment=assignments.find(a=>a.id===state.reportAssignmentId);

  return `
    ${header("Hasil & Evaluasi","Pantau tren kelas, buka grafik tiap siswa, dan lihat soal atau kriteria yang memengaruhi hasil.")}
    <section class="panel" style="margin-bottom:18px">
      <div class="field" style="max-width:460px;margin:0">
        <label>Filter Kelas</label>
        <select id="reportClassSelect">
          <option value="">Semua Kelas</option>
          ${classes.map(c=>`<option value="${c.id}" ${state.reportClassId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
        </select>
      </div>
      ${selectedClass?`<p class="small" style="margin:10px 0 0">Laporan untuk kelas <strong>${esc(selectedClass.name)}</strong>.</p>`:""}
    </section>
    <div class="stats-grid">
      ${stat("Total Pengumpulan",submissions.length,"Seluruh pengumpulan",uiIcon("fileCheck",18))}
      ${stat("Sudah Dinilai",grades.length,"Nilai dipublikasikan",uiIcon("check",18))}
      ${stat("Rata-rata Nilai",average,"Nilai akhir terpublikasi",uiIcon("chart",18))}
      ${stat("Belum Dinilai",submissions.length-grades.length,"Menunggu evaluasi",uiIcon("clock",18))}
    </div>

    <section class="panel" style="margin-bottom:18px">
      <div class="panel-heading">
        <div><h3>Grafik Perkembangan Kelas</h3><p>Rata-rata nilai setiap penugasan, dinormalisasi ke skala 0–100.</p></div>
      </div>
      ${renderTrendChart(classTrend,"Belum ada nilai terpublikasi untuk kelas ini.")}
      <div class="trend-summary">${esc(trendNarrative(classTrend,"Rata-rata kelas"))}<br>${esc(trendItemExplanation(classTrend,submissions,details))}</div>
      ${classTrend.length?`
        <p class="report-intro" style="margin-top:14px">Pilih penugasan untuk melihat soal kuis atau kriteria rubrik yang paling kuat dan yang perlu diperbaiki pada seluruh kelas.</p>
        <div class="report-assignment-list">
          <button type="button" class="report-assignment-button ${!state.reportAssignmentId?"active":""}" data-report-assignment="">
            <span class="assignment-report-copy"><strong>Semua Penugasan</strong><small>Gabungan seluruh evaluasi</small></span>
          </button>
          ${sortedAssignments.filter(a=>classTrend.some(point=>point.id===a.id)).map(a=>`
            <button type="button" class="report-assignment-button ${state.reportAssignmentId===a.id?"active":""}" data-report-assignment="${a.id}">
              <span class="assignment-report-copy"><strong>${esc(a.title)}</strong><small>${esc(a.type||"Penugasan")}</small></span>
            </button>`).join("")}
        </div>`:""}
    </section>

    <section class="panel" style="margin-bottom:18px">
      <div class="panel-heading">
        <div><h3>Analisis Soal & Kriteria Kelas</h3><p>${selectedAssignment?`Rincian untuk ${esc(selectedAssignment.title)}.`:"Gabungan hasil rubrik dan analisis per soal yang sudah dipublikasikan."}</p></div>
      </div>
      ${renderAnalysisItems(classAnalysis,"Rincian soal/kriteria akan muncul setelah penilaian otomatis atau skor rubrik dipublikasikan.")}
    </section>

    <section class="panel" style="margin-bottom:18px">
      <div class="panel-heading">
        <div><h3>Perkembangan Per Siswa</h3><p>Klik nama siswa untuk membuka grafik individual dan penjelasan perubahan nilainya.</p></div>
      </div>
      ${students.length?`
        <div class="report-student-list">
          ${students.map(person=>`
            <button type="button" class="report-student-button ${state.reportStudentId===person.id?"active":""}" data-report-student="${person.id}">
              <span class="avatar">${esc(person.name.charAt(0).toUpperCase())}</span>
              <span class="student-report-copy"><strong>${esc(person.name)}</strong><small>${person.count} nilai dipublikasikan</small></span>
              <span class="report-average">${person.average===null?"—":`${Math.round(person.average)}%`}</span>
            </button>`).join("")}
        </div>
      `:empty("Belum ada siswa yang mengumpulkan","Daftar siswa akan muncul setelah ada pengumpulan pada kelas ini.")}
    </section>

    ${selectedStudent?`
      <section class="panel report-student-detail">
        <div class="report-detail-heading">
          <div><h3>Grafik Individual: ${esc(selectedStudent.name)}</h3><p class="small" style="margin:6px 0 0">Perkembangan nilai siswa pada penugasan yang telah dipublikasikan.</p></div>
          <button type="button" class="btn btn-secondary btn-small" data-clear-report-student>Lihat Semua Siswa</button>
        </div>
        ${renderTrendChart(studentTrend,"Belum ada nilai terpublikasi untuk siswa ini.")}
        <div class="trend-summary">${esc(trendNarrative(studentTrend,`Nilai ${selectedStudent.name}`))}<br>${esc(trendItemExplanation(studentTrend,selectedStudentSubmissions,details))}</div>
        <div style="margin-top:18px">
          <h4 style="font-size:12px;margin-bottom:12px">Kekuatan & Area Perbaikan Individual</h4>
          ${renderAnalysisItems(individualAnalysis,"Belum ada rincian soal atau kriteria untuk siswa ini.")}
        </div>
      </section>
    `:""}

    ${panel("Distribusi Nilai",grades.length?`
      <div class="distribution">
        ${ranges.map(([label,min,max])=>{
          const count=grades.filter(x=>x>=min&&x<=max).length;
          const percent=count/grades.length*100;
          return `<div class="distribution-row">
            <span>${label}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div>
            <strong>${count}</strong>
          </div>`;
        }).join("")}
      </div>`:empty("Belum ada data penilaian","Grafik distribusi akan muncul setelah guru memublikasikan nilai."),
      "Distribusi nilai dari penilaian yang sudah dipublikasikan.")}
  `;
}

/* =====================================================
   STUDENT DOCUMENTS
===================================================== */

async function studentDocuments(){
  const memberships=await query(sb.from("class_members")
    .select("class_id,classes(id,name,is_archived)")
    .eq("student_id",state.session.user.id));

  const activeMemberships=filterPendingMemberships(memberships);
  const ids=activeMemberships.map(x=>x.class_id);
  if(!ids.length){
    return `${header("Dokumen","Materi dan dokumen dikelompokkan sesuai kelas.")}
      ${empty("Belum ada dokumen","Gabung ke kelas untuk mengakses materi dari guru.")}`;
  }

  const assignments=await query(sb.from("assignments")
    .select("id,title,class_id")
    .in("class_id",ids)
    .in("status",["published","completed"]));

  const assignmentIds=assignments.map(x=>x.id);
  const [assignmentFiles,materials]=await Promise.all([
    assignmentIds.length
      ?query(sb.from("assignment_files").select("*").in("assignment_id",assignmentIds))
      :Promise.resolve([]),
    query(sb.from("materials").select("*").in("class_id",ids).order("created_at",{ascending:false}))
  ]);

  const assignmentMap=Object.fromEntries(assignments.map(a=>[a.id,a]));
  const groups=activeMemberships.map(m=>{
    const classId=m.class_id;
    const files=[
      ...assignmentFiles.filter(f=>{
        const assignment=assignmentMap[f.assignment_id];
        return assignment?.class_id===classId&&!isPendingDeletion("assignment_file",f.id);
      }).map(f=>({
        id:f.id,title:f.file_name,fileName:f.file_name,path:f.storage_path,
        detail:`Lampiran penugasan · ${assignmentMap[f.assignment_id]?.title||"Penugasan"}`
      })),
      ...materials.filter(material=>material.class_id===classId&&!isPendingDeletion("material",material.id)&&material.storage_path)
        .map(material=>({
          id:material.id,title:material.title,
          fileName:storageFileName(material.storage_path,material.title),
          path:material.storage_path,
          detail:material.description||"Materi dari guru"
        }))
    ];
    return {id:classId,name:m.classes?.name||"Kelas",files};
  });

  return `${header("Dokumen","Materi dan dokumen dikelompokkan sesuai kelas yang kamu ikuti.")}
    ${groups.map(group=>panel(`Kelas ${group.name}`,group.files.length?`
      <div class="task-list">
        ${group.files.map(f=>`
          <div class="document-row">
            <span>${uiIcon("file",17)}</span>
            <div><strong>${esc(f.title)}</strong><small>${esc(f.detail)}</small></div>
            <button type="button" data-open-file="${esc(f.path)}" title="Buka untuk dibaca">Baca</button>
            <button type="button" data-download-file="${esc(f.path)}" data-file-name="${esc(f.fileName||f.title)}" title="Unduh file">${uiIcon("download",16)}</button>
          </div>`).join("")}
      </div>`:empty("Belum ada dokumen","Materi dari guru untuk kelas ini akan muncul di sini."),`${group.files.length} dokumen tersedia.`)).join("")}
  `;
}

/* =====================================================
   STUDENT RESULTS
===================================================== */

async function studentResults(){
  const memberships=await query(sb.from("class_members")
    .select("class_id,classes(id,name,is_archived)")
    .eq("student_id",state.session.user.id));
  const activeMemberships=filterPendingMemberships(memberships);

  const rows=await query(sb.from("submissions")
    .select("id,assignment_id,submitted_at,assignments(id,title,max_score,class_id,type,created_at),submission_grades(score,feedback,is_published)")
    .eq("student_id",state.session.user.id)
    .order("submitted_at",{ascending:false}));

  const assignmentObjects=[...new Map(rows
    .filter(row=>row.assignments?.id)
    .map(row=>[row.assignments.id,row.assignments])).values()];
  const studentDetails=await loadStudentPerformanceDetails(assignmentObjects,rows);

  const grouped=activeMemberships.map(m=>({
    id:m.class_id,
    name:m.classes?.name||"Kelas",
    rows:rows.filter(r=>r.assignments?.class_id===m.class_id)
  })).filter(group=>group.rows.length);

  return `${header("Hasil & Evaluasi","Lihat grafik perkembangan nilai, kekuatan, dan materi yang perlu ditingkatkan.")}
    ${grouped.length?grouped.map(group=>{
      const publishedRows=group.rows.filter(row=>publishedGradeFor(row));
      const trendPoints=publishedRows.map(row=>{
        const grade=publishedGradeFor(row);
        return {
          id:row.assignment_id,
          label:row.assignments?.title||"Penugasan",
          value:Number(grade.score)/Number(row.assignments?.max_score||100)*100,
          detail:row.assignments?.type||"Penugasan"
        };
      }).sort((a,b)=>{
        const aa=group.rows.find(row=>row.assignment_id===a.id)?.assignments?.created_at||"";
        const bb=group.rows.find(row=>row.assignment_id===b.id)?.assignments?.created_at||"";
        return new Date(aa)-new Date(bb);
      });
      const analysisItems=aggregateAnalysisItems(publishedRows,studentDetails);
      return panel(`Kelas ${group.name}`,`
        <div style="margin-bottom:18px">
          <div class="panel-heading">
            <div><h3>Grafik Perkembangan Nilai Saya</h3><p>Hanya nilai yang sudah dipublikasikan guru.</p></div>
          </div>
          ${renderTrendChart(trendPoints,"Belum ada nilai yang dipublikasikan untuk kelas ini.")}
          <div class="trend-summary">${esc(trendNarrative(trendPoints,"Nilai kamu"))}<br>${esc(trendItemExplanation(trendPoints,group.rows,studentDetails))}</div>
        </div>
        <div style="margin-bottom:18px">
          <h4 style="font-size:12px;margin-bottom:12px">Kekuatan & Materi yang Perlu Ditingkatkan</h4>
          ${renderAnalysisItems(analysisItems,"Rincian soal dan kriteria akan muncul setelah guru memublikasikan evaluasi otomatis atau skor rubrik.")}
        </div>
        <div class="task-list">
          ${group.rows.map(r=>{
            const grade=publishedGradeFor(r);
            const feedback=unpackGradeFeedback(grade?.feedback).text;
            return `<div class="result-card">
              <div class="task-icon">${uiIcon("fileCheck",19)}</div>
              <div class="task-info">
                <strong>${esc(r.assignments?.title)}</strong>
                <small>${esc(r.assignments?.type||"Penugasan")} · Dikumpulkan ${date(r.submitted_at)}</small>
                ${grade?`<p class="feedback-text">${esc(feedback||"Belum ada umpan balik.")}</p>`:""}
              </div>
              ${grade?`<div class="result-score"><strong>${grade.score}</strong><small>Nilai</small></div>`:badge("submitted")}
            </div>`;
          }).join("")}
        </div>`,`${group.rows.length} pengumpulan · ${publishedRows.length} nilai terpublikasi.`);
    }).join(""):empty("Belum ada hasil pekerjaan","Hasil akan muncul setelah kamu mengumpulkan tugas dan guru memublikasikan penilaian.")}
  `;
}

/* =====================================================
   PAGE ROUTER
===================================================== */

async function pageContent(){
  if(teacher()){
    switch(state.page){
      case "dashboard":return await teacherDashboard();
      case "classes":return await teacherClasses();
      case "assignments":return await teacherAssignments();
      case "materials":return await teacherMaterials();
      case "review":return await teacherReview();
      case "reports":return await teacherReports();
      case "profile":return profilePage();
      default:return await teacherDashboard();
    }
  }

  switch(state.page){
    case "dashboard":return await studentDashboard();
    case "classes":return await studentClasses();
    case "assignments":return await studentAssignments();
    case "task":return await studentTask();
    case "documents":return await studentDocuments();
    case "results":return await studentResults();
    case "profile":return profilePage();
    default:return await studentDashboard();
  }
}

/* =====================================================
   MAIN RENDER
===================================================== */

async function render(){
  const token=++state.renderToken;

  if(!configured){
    app.innerHTML=`<div class="config-screen">
      <div class="config-card">
        <div class="brand-mark" style="margin:auto">K</div>
        <h2>Hubungkan Supabase</h2>
        <p>Masukkan URL proyek dan publishable key Supabase pada bagian konfigurasi di awal JavaScript.</p>
        <code>const SUPABASE_URL = "https://PROJECT_ID.supabase.co";</code>
        <code>const SUPABASE_ANON_KEY = "PUBLISHABLE_KEY";</code>
      </div>
    </div>`;
    return;
  }

  if(!state.session){
    app.innerHTML=state.authMode==="landing"?landingPage():authPage();
    return;
  }

  if(!state.profile){
    app.innerHTML=`<div class="loading"><div class="spinner"></div></div>`;
    return;
  }

  if(!["teacher","student"].includes(state.profile.role)){
    app.innerHTML=`<div class="config-screen"><div class="config-card">
      <h2>Peran akun belum tersedia</h2>
      <p>Administrator perlu menetapkan peran akun melalui tabel profiles di Supabase.</p>
      <button class="btn btn-primary" data-action="logout">Keluar</button>
    </div></div>`;
    return;
  }

  try{
    const content=await pageContent();
    if(token!==state.renderToken)return;
    app.innerHTML=shell(content);
  }catch(error){
    if(token!==state.renderToken)return;
    console.error(error);
    app.innerHTML=shell(`
      <section class="panel">
        <h3>Gagal memuat halaman</h3>
        <p class="muted">${esc(error.message)}</p>
        <button class="btn btn-primary" data-action="refresh">Coba Lagi</button>
      </section>`);
  }
}

/* =====================================================
   AUTH ACTIONS
===================================================== */

async function login(form){
  const data=new FormData(form);
  const email=data.get("email");
  const password=data.get("password");

  const button=form.querySelector('button[type="submit"]');
  button.disabled=true;
  button.textContent="Memproses...";

  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) throw error;
}

async function register(form){
  const data=new FormData(form);
  const name=String(data.get("full_name")||"").trim();
  const email=data.get("email");
  const password=data.get("password");
  const confirmation=data.get("confirmation");

  if(password!==confirmation) throw new Error("Konfirmasi password tidak sesuai.");
  if(String(password).length<8) throw new Error("Password minimal 8 karakter.");

  const {data:result,error}=await sb.auth.signUp({
    email,password,
    options:{data:{full_name:name}}
  });

  if(error) throw error;

  if(result.session){
    notify("Pendaftaran berhasil.");
  }else{
    notify("Pendaftaran berhasil. Periksa email untuk konfirmasi akun.");
    state.authMode="login";
    render();
  }
}

async function uploadFile(file,path){
  if(!file) return null;
  if(file.size>10*1024*1024) throw new Error("Ukuran berkas maksimal 10 MB.");

  const {error}=await sb.storage.from("kantora-private").upload(path,file);
  if(error) throw error;
  return path;
}

async function openAssignmentEditor(id){
  const assignment=await query(sb.from("assignments")
    .select("*").eq("id",id).eq("teacher_id",state.session.user.id).single());
  const [files,rubrics,questions]=await Promise.all([
    query(sb.from("assignment_files").select("*").eq("assignment_id",id)),
    query(sb.from("rubric_criteria").select("*").eq("assignment_id",id).order("criterion_order")),
    query(sb.from("quiz_questions").select("*").eq("assignment_id",id).order("question_order"))
  ]);

  const quizDraft=[];
  for(const q of questions){
    const options=await query(sb.from("quiz_options")
      .select("id,option_text,option_order")
      .eq("question_id",q.id).order("option_order"));
    const key=await query(sb.from("quiz_answer_keys")
      .select("correct_option_id").eq("question_id",q.id).maybeSingle());
    quizDraft.push({
      id:q.id,
      text:q.question_text,
      options:options.map(o=>o.option_text),
      correct:Math.max(0,options.findIndex(o=>o.id===key?.correct_option_id)),
      points:q.points||10
    });
  }

  state.editingAssignmentId=id;
  state.editingAssignment={...assignment,files,rubrics};
  state.assignmentType=assignment.type;
  state.quizDraft=quizDraft;
  state.showAssignmentForm=true;
  await render();
}

async function createAssignment(form){
  const data=new FormData(form);
  const type=String(data.get("type"));
  const editingId=state.editingAssignmentId;
  const files=Array.from(data.getAll("files")).filter(x=>x instanceof File&&x.size>0);
  const retainedFiles=(state.editingAssignment?.files||[])
    .filter(f=>!isPendingDeletion("assignment_file",f.id)).length;

  if(type==="quiz"&&!state.quizDraft.length){
    throw new Error("Tambahkan minimal satu pertanyaan kuis.");
  }
  if(retainedFiles+files.length>5){
    throw new Error(`Lampiran penugasan maksimal 5 berkas. Saat ini ${retainedFiles} berkas masih tersimpan.`);
  }
  if(files.some(file=>file.size>10*1024*1024)){
    throw new Error("Ukuran setiap berkas maksimal 10 MB.");
  }

  const dueAt=data.get("due_at")?new Date(data.get("due_at")).toISOString():null;
  const payload={
    class_id:data.get("class_id"),
    title:String(data.get("title")).trim(),
    type,
    description:data.get("description"),
    alert_title:data.get("alert_title")||data.get("title"),
    alert_message:data.get("alert_message")||data.get("description"),
    instructions:data.get("instructions"),
    due_at:dueAt,
    max_score:Number(data.get("max_score")),
    external_url:type==="external"?data.get("external_url"):null,
    external_platform:type==="external"?data.get("external_platform"):null,
    submission_mode:type==="external"?(data.get("submission_mode")||"text"):"text"
  };

  let assignmentId;
  let reopened=false;
  if(editingId){
    const currentStatus=state.editingAssignment?.status;
    reopened=currentStatus==="completed"&&dueAt&&new Date(dueAt).getTime()>Date.now();
    await query(sb.from("assignments").update({
      ...payload,
      ...(reopened?{status:"published"}:{})
    }).eq("id",editingId).eq("teacher_id",state.session.user.id));
    assignmentId=editingId;

    const oldQuestions=await query(sb.from("quiz_questions").select("id").eq("assignment_id",assignmentId));
    const oldQuestionIds=oldQuestions.map(q=>q.id);
    if(oldQuestionIds.length){
      await query(sb.from("quiz_answer_keys").delete().in("question_id",oldQuestionIds));
      await query(sb.from("quiz_options").delete().in("question_id",oldQuestionIds));
      await query(sb.from("quiz_questions").delete().in("id",oldQuestionIds));
    }
    const oldCriteria=await query(sb.from("rubric_criteria").select("id").eq("assignment_id",assignmentId));
    const oldCriterionIds=oldCriteria.map(x=>x.id);
    if(oldCriterionIds.length){
      await query(sb.from("submission_rubric_scores").delete().in("criterion_id",oldCriterionIds));
      await query(sb.from("rubric_criteria").delete().in("id",oldCriterionIds));
    }
  }else{
    const created=await query(sb.rpc("kantora_create_assignment",{
      p_assignment:payload
    }));
    assignmentId=typeof created==="string"
      ?created
      :Array.isArray(created)
        ?(created[0]?.id||created[0])
        :(created?.id||created);
    if(!assignmentId)throw new Error("Supabase tidak mengembalikan ID penugasan yang baru dibuat. Periksa fungsi kantora_create_assignment pada SQL.");
  }

  if(type==="quiz"){
    for(let i=0;i<state.quizDraft.length;i++){
      const q=state.quizDraft[i];
      const text=form.querySelector(`[data-q-text="${i}"]`)?.value?.trim();
      const options=q.options.map((_,j)=>
        form.querySelector(`[data-q-option="${i}-${j}"]`)?.value?.trim()
      );
      const correct=Number(form.querySelector(`[data-q-correct="${i}"]`)?.value||0);
      const points=Number(form.querySelector(`[data-q-points="${i}"]`)?.value||10);

      if(!text||options.some(x=>!x)) throw new Error("Lengkapi seluruh pertanyaan dan pilihan jawaban.");

      const question=await query(sb.from("quiz_questions")
        .insert({
          assignment_id:assignmentId,
          question_text:text,
          question_order:i+1,
          points
        }).select("id").single());

      const inserted=await query(sb.from("quiz_options")
        .insert(options.map((option,j)=>({
          question_id:question.id,
          option_text:option,
          option_order:j+1
        }))).select("id,option_order"));

      await query(sb.from("quiz_answer_keys").insert({
        question_id:question.id,
        correct_option_id:inserted.find(x=>x.option_order===correct+1).id
      }));
    }
  }

  const rubricText=String(data.get("rubrics")||"").trim();
  if(rubricText){
    const rows=rubricText.split("\n").map((line,i)=>{
      const parts=line.split("|").map(x=>x.trim());
      return {
        assignment_id:assignmentId,
        criterion_name:parts[0],
        description:parts[1]||"",
        max_points:Number(parts[2]||25),
        weight:1,
        criterion_order:i+1
      };
    }).filter(x=>x.criterion_name);
    if(rows.length)await query(sb.from("rubric_criteria").insert(rows));
  }

  for(const file of files){
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`assignments/${assignmentId}/${crypto.randomUUID()}-${safeName}`;
    await uploadFile(file,path);
    await query(sb.from("assignment_files").insert({
      assignment_id:assignmentId,
      file_name:file.name,
      storage_path:path,
      mime_type:file.type,
      file_size:file.size
    }));
  }

  state.showAssignmentForm=false;
  state.quizDraft=[];
  state.assignmentType="case";
  state.editingAssignmentId="";
  state.editingAssignment=null;
  notify(reopened
    ?"Tenggat berhasil diperpanjang dan penugasan dibuka kembali untuk siswa."
    :editingId?"Perubahan penugasan berhasil disimpan.":"Penugasan berhasil disimpan sebagai draft.");
  render();
}

async function createMaterial(form){
  const data=new FormData(form);
  const files=Array.from(data.getAll("material_files"))
    .filter(file=>file instanceof File&&file.size>0);
  const title=String(data.get("title")||"").trim();
  const description=String(data.get("description")||"").trim();
  const classId=String(data.get("class_id")||"");
  const totalBytes=files.reduce((sum,file)=>sum+file.size,0);
  const maxTotalBytes=10*1024*1024;

  if(!classId)throw new Error("Pilih kelas tujuan untuk materi ini.");
  if(files.length>5)throw new Error("Maksimal 5 file dalam satu kali unggah.");
  if(totalBytes>maxTotalBytes)throw new Error("Total ukuran seluruh file maksimal 10 MB.");
  if(!state.editingMaterialId&&!files.length)throw new Error("Pilih minimal satu berkas.");

  const editingId=state.editingMaterialId;
  const oldMaterial=state.editingMaterial;
  const oldPath=oldMaterial?.storage_path||null;
  const uploads=files.map((file,index)=>{
    const id=editingId&&index===0?editingId:crypto.randomUUID();
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    return {
      id,
      file,
      path:`materials/${id}/${crypto.randomUUID()}-${safeName}`,
      title:files.length>1&&index>0?`${title} — ${file.name}`:title
    };
  });
  const uploadedPaths=[];
  const insertedIds=[];
  let existingUpdated=false;

  try{
    // Buat row metadata lebih dahulu agar policy Storage dapat memvalidasi
    // bahwa ID folder memang milik materi guru dan kelas yang benar.
    if(editingId){
      await query(sb.from("materials").update({
        title,description,class_id:classId
      }).eq("id",editingId).eq("teacher_id",state.session.user.id));
      existingUpdated=true;

      for(const item of uploads.slice(1)){
        await query(sb.from("materials").insert({
          id:item.id,
          teacher_id:state.session.user.id,
          class_id:classId,
          title:item.title,
          description,
          storage_path:null
        }));
        insertedIds.push(item.id);
      }
    }else{
      for(const item of uploads){
        await query(sb.from("materials").insert({
          id:item.id,
          teacher_id:state.session.user.id,
          class_id:classId,
          title:item.title,
          description,
          storage_path:null
        }));
        insertedIds.push(item.id);
      }
    }

    // Setelah row ada, unggah berkas dan simpan path ke row masing-masing.
    for(const item of uploads){
      await uploadFile(item.file,item.path);
      uploadedPaths.push(item.path);
      await query(sb.from("materials").update({storage_path:item.path})
        .eq("id",item.id).eq("teacher_id",state.session.user.id));
    }
  }catch(error){
    if(existingUpdated&&oldMaterial){
      try{
        await query(sb.from("materials").update({
          title:oldMaterial.title,
          description:oldMaterial.description,
          class_id:oldMaterial.class_id,
          storage_path:oldMaterial.storage_path
        }).eq("id",editingId).eq("teacher_id",state.session.user.id));
      }catch(rollbackError){console.error("Rollback materi gagal:",rollbackError);}
    }
    if(insertedIds.length){
      try{await query(sb.from("materials").delete().in("id",insertedIds));}
      catch(rollbackError){console.error("Rollback baris materi gagal:",rollbackError);}
    }
    await removeStoragePaths(uploadedPaths);
    throw error;
  }

  if(editingId&&uploads.length&&oldPath)await removeStoragePaths([oldPath]);
  state.selectedMaterialClassId=classId;
  state.editingMaterialId="";
  state.editingMaterial=null;
  notify(editingId?"Dokumen berhasil diperbarui.":"Seluruh dokumen berhasil diunggah ke kelas tujuan.");
  await render();
}

async function updateSubmissionRecord(id,payload){
  await query(sb.from("submissions").update(payload).eq("id",id));
}

async function insertSubmissionRecord(payload){
  await query(sb.from("submissions").insert(payload));
}

async function ensureSubmissionOpen(assignmentId){
  const task=await query(sb.from("assignments")
    .select("id,due_at,status").eq("id",assignmentId).single());
  if(task.status!=="published")throw new Error("Penugasan tidak lagi menerima pengumpulan.");
  if(deadlinePassed(task))throw new Error("Tenggat telah lewat. Pengumpulan dan perubahan sudah dikunci.");
  return task;
}

async function createSubmission(form){
  const data=new FormData(form);
  const assignmentId=String(data.get("assignment_id"));
  await ensureSubmissionOpen(assignmentId);

  const existing=await query(sb.from("submissions")
    .select("id,submitted_file_path")
    .eq("assignment_id",assignmentId)
    .eq("student_id",state.session.user.id)
    .maybeSingle());

  if(existing){
    const pending=readPendingDeletes().find(x=>x.userId===state.session.user.id&&x.type==="submission"&&x.id===String(existing.id));
    if(pending)removePendingItem(pending.key);
  }

  const file=data.get("file");
  const oldPath=existing?.submitted_file_path||null;
  let newPath=oldPath;
  let uploadedPath=null;

  if(file instanceof File&&file.size){
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    newPath=`submissions/${state.session.user.id}/${assignmentId}/${crypto.randomUUID()}-${safeName}`;
    await uploadFile(file,newPath);
    uploadedPath=newPath;
  }

  const now=new Date().toISOString();
  const payload={
    assignment_id:assignmentId,
    student_id:state.session.user.id,
    response_text:data.get("response_text")||null,
    submitted_file_path:newPath,
    external_completion_note:data.get("external_completion_note")||null,
    status:"submitted",
    submitted_at:now
  };

  try{
    if(existing){
      await updateSubmissionRecord(existing.id,payload);
      if(uploadedPath&&oldPath)await removeStoragePaths([oldPath]);
      notify("Pengumpulan diperbarui pada data yang sama.");
    }else{
      await insertSubmissionRecord(payload);
      notify("Pekerjaan berhasil dikumpulkan.");
    }
  }catch(error){
    if(uploadedPath)await removeStoragePaths([uploadedPath]);
    throw error;
  }

  go("task",assignmentId);
}

async function submitQuiz(form){
  const data=new FormData(form);
  const assignmentId=String(data.get("assignment_id"));
  await ensureSubmissionOpen(assignmentId);

  const answers={};
  for(const [key,value] of data.entries()){
    if(key.startsWith("q_"))answers[key.substring(2)]=value;
  }

  const questions=await query(sb.from("quiz_questions")
    .select("id,question_text,question_order")
    .eq("assignment_id",assignmentId).order("question_order"));

  if(!questions.length)throw new Error("Pertanyaan kuis tidak ditemukan.");
  if(questions.some(q=>!answers[q.id]))throw new Error("Jawab seluruh pertanyaan sebelum mengirim.");

  const answerSnapshot=[];
  for(const q of questions){
    const options=await query(sb.from("quiz_options")
      .select("id,option_text").eq("question_id",q.id));
    const selected=options.find(o=>o.id===answers[q.id]);
    answerSnapshot.push({
      question_id:q.id,
      question:q.question_text,
      option_id:answers[q.id],
      answer:selected?.option_text||"Jawaban tidak ditemukan"
    });
  }
  const responseText=JSON.stringify({kind:"kantora_quiz",answers:answerSnapshot});

  const existing=await query(sb.from("submissions")
    .select("id")
    .eq("assignment_id",assignmentId)
    .eq("student_id",state.session.user.id)
    .maybeSingle());

  if(existing){
    const pending=readPendingDeletes().find(x=>x.userId===state.session.user.id&&x.type==="submission"&&x.id===String(existing.id));
    if(pending)removePendingItem(pending.key);
    await updateSubmissionRecord(existing.id,{
      assignment_id:assignmentId,
      student_id:state.session.user.id,
      response_text:responseText,
      submitted_file_path:null,
      external_completion_note:null,
      status:"submitted",
      submitted_at:new Date().toISOString()
    });
    notify("Jawaban kuis diperbarui pada pengumpulan yang sama.");
  }else{
    // RPC lama tetap dipakai untuk proses kuis pertama kali; snapshot jawaban disimpan
    // pada baris submissions agar perubahan berikutnya memperbarui baris yang sama.
    await query(sb.rpc("submit_quiz",{
      p_assignment_id:assignmentId,
      p_answers:answers
    }));
    const created=await query(sb.from("submissions")
      .select("id")
      .eq("assignment_id",assignmentId)
      .eq("student_id",state.session.user.id)
      .maybeSingle());
    if(created){
      await updateSubmissionRecord(created.id,{
        response_text:responseText,
        status:"submitted",
        submitted_at:new Date().toISOString()
      });
    }else{
      await insertSubmissionRecord({
        assignment_id:assignmentId,
        student_id:state.session.user.id,
        response_text:responseText,
        submitted_file_path:null,
        external_completion_note:null,
        status:"submitted",
        submitted_at:new Date().toISOString()
      });
    }
    notify("Jawaban kuis berhasil dikumpulkan.");
  }

  go("task",assignmentId);
}

async function saveGrade(form,publish){
  const data=new FormData(form);
  const submissionId=data.get("submission_id");
  const score=Number(data.get("score"));
  const feedback=data.get("feedback")||"";
  let analysis=null;
  const rawAnalysis=String(data.get("auto_analysis")||"");
  if(rawAnalysis){
    try{analysis=JSON.parse(decodeURIComponent(rawAnalysis));}
    catch(error){console.warn("Metadata evaluasi tidak dapat disimpan:",error);}
  }

  const rubricEntries=[...data.entries()].filter(([key])=>key.startsWith("rubric_"));
  if(!analysis){
    const manualItems=[...form.querySelectorAll("[data-rubric-max]")]
      .filter(input=>input.value!=="")
      .map(input=>{
        const max=Number(input.dataset.rubricMax||0);
        const earned=Number(input.value);
        return {
          kind:"criterion",
          id:input.name.substring(7),
          name:input.dataset.criterionName||"Kriteria rubrik",
          description:input.dataset.criterionDescription||"",
          earned,
          max_points:max,
          percent:max>0?earned/max*100:0
        };
      });
    if(manualItems.length){
      analysis={version:1,assignment_type:"manual",items:manualItems};
    }
  }
  if(analysis?.items){
    for(const [key,value] of rubricEntries){
      const criterionId=key.substring(7);
      const input=form.querySelector(`[name="${key}"]`);
      const item=analysis.items.find(row=>row.kind==="criterion"&&String(row.id)===criterionId);
      if(item&&value!==""){
        const max=Number(input?.dataset.rubricMax||item.max_points||0);
        item.earned=Number(value);
        item.max_points=max;
        item.percent=max>0?Number(value)/max*100:0;
      }
    }
  }

  await query(sb.from("submission_grades").upsert({
    submission_id:submissionId,
    score,
    feedback:packGradeFeedback(feedback,analysis),
    is_published:publish,
    published_at:publish?new Date().toISOString():null
  },{onConflict:"submission_id"}));

  for(const [key,value] of rubricEntries){
    const criterionId=key.substring(7);
    if(value===""){
      await query(sb.from("submission_rubric_scores").delete()
        .eq("submission_id",submissionId).eq("criterion_id",criterionId));
      continue;
    }
    await query(sb.from("submission_rubric_scores").upsert({
      submission_id:submissionId,
      criterion_id:criterionId,
      score:Number(value)
    },{onConflict:"submission_id,criterion_id"}));
  }

  notify(publish?"Nilai berhasil dipublikasikan.":"Penilaian berhasil disimpan.");
  state.selectedSubmissionId=submissionId;
  render();
}

function storageFileName(path,fallback="dokumen"){
  const last=String(path||"").split("/").pop()||fallback;
  const withoutId=last.replace(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-/i,"");
  try{return decodeURIComponent(withoutId)||fallback;}
  catch(_){return withoutId||fallback;}
}

async function openPrivateFile(path,mode="preview",fileName=""){
  let previewWindow=null;
  if(mode!=="download"){
    // Buka tab secara sinkron pada gesture klik agar tidak diblokir browser.
    previewWindow=window.open("about:blank","_blank");
    if(previewWindow)previewWindow.opener=null;
  }

  const options=mode==="download"?{download:fileName||true}:{};
  const {data,error}=await sb.storage.from("kantora-private")
    .createSignedUrl(path,300,options);

  if(error){
    if(previewWindow&&!previewWindow.closed)previewWindow.close();
    throw error;
  }

  if(mode==="download"){
    const link=document.createElement("a");
    link.href=data.signedUrl;
    link.download=fileName||storageFileName(path);
    link.rel="noopener";
    document.body.appendChild(link);
    link.click();
    link.remove();
    return;
  }

  if(previewWindow&&!previewWindow.closed){
    previewWindow.location.replace(data.signedUrl);
  }else{
    window.location.assign(data.signedUrl);
  }
}

/* =====================================================
   EVENT HANDLERS
===================================================== */

document.addEventListener("click",async event=>{
  const target=event.target.closest("button");
  if(!target)return;

  try{
    if(target.dataset.confirmCancel!==undefined){
      document.getElementById("kantora-confirm")?.remove();
      state.confirmCallback=null;
      return;
    }
    if(target.dataset.confirmAccept!==undefined){
      const callback=state.confirmCallback;
      document.getElementById("kantora-confirm")?.remove();
      state.confirmCallback=null;
      if(callback)await callback();
      return;
    }
    if(target.dataset.undoDelete){
      await undoPendingDeletion(target.dataset.undoDelete);
      return;
    }
    if(target.dataset.action==="login"){
      state.authMode="login";render();return;
    }
    if(target.dataset.action==="register"){
      state.authMode="register";render();return;
    }
    if(target.dataset.action==="forgot"){
      state.authMode="forgot";render();return;
    }
    if(target.dataset.action==="home"){
      state.authMode="landing";render();return;
    }
    if(target.dataset.action==="logout"){
      showConfirm("Keluar dari KANTORA?",async()=>{await sb.auth.signOut();},"Keluar");
      return;
    }
    if(target.dataset.action==="refresh"){
      render();return;
    }
    if(target.dataset.action==="toggle-assignment"){
      const closing=state.showAssignmentForm;
      state.showAssignmentForm=!state.showAssignmentForm;
      if(closing){
        state.quizDraft=[];
        state.editingAssignmentId="";
        state.editingAssignment=null;
        state.assignmentType="case";
      }else{
        state.editingAssignmentId="";
        state.editingAssignment=null;
        state.quizDraft=[];
        state.assignmentType="case";
      }
      render();return;
    }
    if(target.dataset.action==="add-question"){
      state.quizDraft.push({text:"",options:["","","",""],correct:0,points:10});
      const container=document.getElementById("questionDraft");
      if(container)container.innerHTML=questionDraftHTML();
      return;
    }
    if(target.dataset.removeQuestion!==undefined){
      state.quizDraft.splice(Number(target.dataset.removeQuestion),1);
      const container=document.getElementById("questionDraft");
      if(container)container.innerHTML=questionDraftHTML();
      return;
    }
    if(target.dataset.action==="mobile-menu"){
      document.getElementById("sidebar")?.classList.toggle("open");
      document.getElementById("overlay")?.classList.toggle("show");
      return;
    }
    if(target.dataset.action==="close-class-detail"){
      state.selectedClassId="";
      render();return;
    }
    if(target.dataset.action==="cancel-edit-class"){
      state.editingClassId="";
      render();return;
    }
    if(target.dataset.action==="cancel-edit-material"){
      state.editingMaterialId="";
      state.editingMaterial=null;
      render();return;
    }
    if(target.dataset.openMaterialClass!==undefined){
      state.selectedMaterialClassId=target.dataset.openMaterialClass;
      state.editingMaterialId="";
      state.editingMaterial=null;
      render();return;
    }
    if(target.dataset.action==="close-class-code"){
      state.classCode="";
      state.classCodeClassId="";
      render();return;
    }
    if(target.dataset.action==="copy-class-code"){
      if(!state.classCode)return;
      try{
        await navigator.clipboard.writeText(state.classCode);
      }catch(_){
        const area=document.createElement("textarea");
        area.value=state.classCode;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      notify("Kode kelas berhasil disalin.");
      return;
    }

    if(target.dataset.page){
      state.showAssignmentForm=false;
      state.editingAssignmentId="";
      state.editingAssignment=null;
      go(target.dataset.page);return;
    }

    if(target.dataset.type){
      state.assignmentType=target.dataset.type;
      if(target.dataset.type!=="quiz")state.quizDraft=[];
      render();return;
    }

    if(target.dataset.task){
      go("task",target.dataset.task);return;
    }

    if(target.dataset.openClass){
      state.selectedClassId=target.dataset.openClass;
      state.editingClassId="";
      render();return;
    }
    if(target.dataset.editClass){
      state.editingClassId=target.dataset.editClass;
      state.selectedClassId=target.dataset.editClass;
      render();return;
    }
    if(target.dataset.deleteClass){
      const classId=target.dataset.deleteClass;
      const row=await query(sb.from("classes")
        .select("is_archived").eq("id",classId).single());
      showConfirm("Menghapus kelas juga akan menghapus penugasan, lampiran, pengumpulan, dan penilaian yang berada di kelas tersebut. Setelah dikonfirmasi, tersedia waktu 5 detik untuk Undo sebelum penghapusan permanen.",async()=>{
        await queueDeletion("class",classId,{wasArchived:row.is_archived},
          "Kelas dan seluruh data terkait dijadwalkan untuk dihapus. Tekan Undo untuk memulihkan.");
      },"Jadwalkan Penghapusan");
      return;
    }
    if(target.dataset.removeStudent){
      const classId=target.dataset.removeStudent;
      const studentId=target.dataset.studentId;
      await queueDeletion("membership",membershipKey(classId,studentId),{
        classId,studentId
      },"Siswa dijadwalkan untuk dikeluarkan dari kelas. Tekan Undo untuk membatalkan.");
      return;
    }
    if(target.dataset.leaveClass){
      const classId=target.dataset.leaveClass;
      await queueDeletion("membership",membershipKey(classId,state.session.user.id),{
        classId,studentId:state.session.user.id
      },"Kamu dijadwalkan keluar dari kelas. Tekan Undo untuk tetap bergabung.");
      return;
    }

    if(target.dataset.code){
      const code=await getClassCode(target.dataset.code);
      state.classCode=code;
      state.classCodeClassId=target.dataset.code;
      render();return;
    }

    if(target.dataset.editAssignment){
      await openAssignmentEditor(target.dataset.editAssignment);
      return;
    }
    if(target.dataset.removeAssignmentFile){
      await queueDeletion("assignment_file",target.dataset.removeAssignmentFile,{},
        "Lampiran dijadwalkan untuk dihapus. Tekan Undo untuk memulihkan.");
      return;
    }

    if(target.dataset.publish){
      showConfirm("Publikasikan penugasan ini agar siswa dapat mulai mengerjakan?",async()=>{
        await publishAssignment(target.dataset.publish,"published");
      },"Publikasikan");
      return;
    }

    if(target.dataset.complete){
      showConfirm("Tandai penugasan selesai? Siswa tidak dapat lagi mengirim atau mengubah jawaban.",async()=>{
        await publishAssignment(target.dataset.complete,"completed");
      },"Selesaikan");
      return;
    }

    if(target.dataset.deleteAssignment){
      await deleteAssignment(target.dataset.deleteAssignment);return;
    }

    if(target.dataset.review){
      state.reviewAssignmentId=target.dataset.review;
      state.selectedSubmissionId="";
      go("review",target.dataset.review);return;
    }

    if(target.dataset.selectSubmission){
      state.selectedSubmissionId=target.dataset.selectSubmission;
      render();return;
    }
    if(target.dataset.reportStudent!==undefined){
      state.reportStudentId=target.dataset.reportStudent;
      render();return;
    }
    if(target.dataset.clearReportStudent!==undefined){
      state.reportStudentId="";
      render();return;
    }
    if(target.dataset.reportAssignment!==undefined){
      state.reportAssignmentId=target.dataset.reportAssignment;
      render();return;
    }

    if(target.dataset.downloadFile){
      await openPrivateFile(
        target.dataset.downloadFile,
        "download",
        target.dataset.fileName||storageFileName(target.dataset.downloadFile)
      );
      return;
    }

    if(target.dataset.openFile){
      await openPrivateFile(target.dataset.openFile,"preview",target.dataset.fileName||"");
      return;
    }

    if(target.dataset.editMaterial){
      await openMaterialEditor(target.dataset.editMaterial);return;
    }
    if(target.dataset.deleteMaterial){
      await queueDeletion("material",target.dataset.deleteMaterial,{},
        "Dokumen dijadwalkan untuk dihapus. Tekan Undo untuk memulihkan.");
      return;
    }

    if(target.dataset.deleteSubmission){
      const submission=await query(sb.from("submissions")
        .select("assignment_id").eq("id",target.dataset.deleteSubmission).single());
      await ensureSubmissionOpen(submission.assignment_id);
      const grades=await query(sb.from("submission_grades").select("is_published")
        .eq("submission_id",target.dataset.deleteSubmission));
      if(grades.some(g=>g.is_published))throw new Error("Pengumpulan yang sudah dinilai dan dipublikasikan tidak dapat dihapus.");
      await queueDeletion("submission",target.dataset.deleteSubmission,{},
        "Pengumpulan dijadwalkan untuk dihapus. Tekan Undo untuk memulihkan jawaban dan lampiran.");
      return;
    }
  }catch(error){
    fail(error);
  }
});

document.addEventListener("change",event=>{
  if(event.target.id==="reviewAssignmentSelect"){
    state.reviewAssignmentId=event.target.value;
    state.selectedSubmissionId="";
    render();
  }
  if(event.target.id==="reportClassSelect"){
    state.reportClassId=event.target.value;
    state.reportStudentId="";
    state.reportAssignmentId="";
    render();
  }
  if(event.target.name==="material_files"){
    const selected=[...event.target.files];
    const totalBytes=selected.reduce((sum,file)=>sum+file.size,0);
    if(selected.length>5){
      notify("Maksimal 5 file dalam satu kali unggah.","error");
      event.target.value="";
      return;
    }
    if(totalBytes>10*1024*1024){
      notify("Total ukuran seluruh file maksimal 10 MB.","error");
      event.target.value="";
      return;
    }
  }
  if(event.target.name==="files"){
    const editingCount=(state.editingAssignment?.files||[])
      .filter(f=>!isPendingDeletion("assignment_file",f.id)).length;
    if(editingCount+event.target.files.length>5){
      notify("Maksimal 5 berkas untuk satu penugasan.","error");
      event.target.value="";
    }
    const oversized=[...event.target.files].some(file=>file.size>10*1024*1024);
    if(oversized){
      notify("Ukuran setiap berkas maksimal 10 MB.","error");
      event.target.value="";
    }
  }
});

document.addEventListener("input",event=>{
  if(!event.target.matches("#gradeForm [data-rubric-max]"))return;
  const form=event.target.closest("#gradeForm");
  if(!form)return;
  const inputs=[...form.querySelectorAll("[data-rubric-max]")];
  const maxScore=Number(form.dataset.maxScore||100);
  let earnedPoints=0;
  let maxPoints=0;
  for(const input of inputs){
    const max=Number(input.dataset.rubricMax||0);
    if(max<=0)continue;
    const score=input.value===""?0:Number(input.value);
    earnedPoints+=Math.min(max,Math.max(0,score));
    maxPoints+=max;
  }
  if(maxPoints>0){
    const scoreField=form.querySelector('[name="score"]');
    if(scoreField)scoreField.value=String(Math.round((earnedPoints/maxPoints)*maxScore*100)/100);
  }
});

document.addEventListener("submit",async event=>{
  const form=event.target;
  if(!form.id)return;

  event.preventDefault();

  try{
    switch(form.id){
      case "authForm":{
        const mode=state.authMode;
        if(mode==="login")await login(form);
        else if(mode==="register")await register(form);
        else await forgotPassword(form);
        break;
      }
      case "classForm":await saveClass(form);break;
      case "joinClassForm":await joinClass(form);break;
      case "assignmentForm":await createAssignment(form);break;
      case "materialForm":await createMaterial(form);break;
      case "submissionForm":await createSubmission(form);break;
      case "quizForm":await submitQuiz(form);break;
      case "gradeForm":{
        const publish=event.submitter?.value==="true";
        await saveGrade(form,publish);
        break;
      }
      case "profileForm":await saveProfile(form);break;
    }
  }catch(error){
    fail(error);
    const message=document.getElementById("authMessage");
    if(message&&form.id==="authForm"){
      message.innerHTML=`<div class="notice error">${esc(error.message)}</div>`;
    }
  }
});

/* =====================================================
   AUTH INITIALIZATION
===================================================== */

async function initialize(){
  if(!sb){
    render();
    return;
  }

  const {data,error}=await sb.auth.getSession();

  if(error){
    fail(error);
    return;
  }

  state.session=data.session;

  if(state.session){
    try{
      state.profile=await loadProfile(state.session.user);
      state.page="dashboard";
      await resumePendingDeletions();
    }catch(error){
      console.error(error);
      state.profile=null;
    }
  }

  await render();

  sb.auth.onAuthStateChange(async(_event,session)=>{
    state.session=session;

    if(session){
      try{
        state.profile=await loadProfile(session.user);
        state.page="dashboard";
        await resumePendingDeletions();
      }catch(error){
        console.error(error);
        state.profile=null;
      }
    }else{
      state.profile=null;
      state.authMode="landing";
      state.page="dashboard";
    }

    await render();
  });
}

initialize();
</script>
